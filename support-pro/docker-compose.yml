name: ${COMPOSE_PROJECT_NAME:-support-pro-2}
x-app: &app
  build:
    context: .
    dockerfile: app/Dockerfile
  env_file: .env
  volumes:
    - uploads:/data/uploads
services:
  db:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata18:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: ["sh", "-c", 'exec docker-entrypoint.sh redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    <<: *app
    restart: 'no'
    command: python -m app.migrate
    depends_on:
      db: {condition: service_healthy}
  app:
    <<: *app
    environment:
      TRUSTED_PROXY_CIDRS: ${NGINX_INGRESS_IP:-172.30.85.2}/32
    networks:
      default: {}
      ingress:
        ipv4_address: ${APP_INGRESS_IP:-172.30.85.3}
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health',timeout=5)"]
      interval: 30s
      timeout: 8s
      start_period: 90s
      retries: 3
  bot:
    <<: *app
    restart: unless-stopped
    command: python -m app.bot
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  worker:
    <<: *app
    restart: unless-stopped
    command: python -m app.worker
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  backup:
    user: "10001:10001"
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
      - ./scripts/restore-check.sh:/restore-check.sh:ro
      - uploads:/data/uploads:ro
    depends_on:
      db: {condition: service_healthy}
    entrypoint: ["/bin/sh", "/backup.sh"]
  clamav:
    image: clamav/clamav:stable@sha256:0e31ce089574268aefa0b543767d66b70240ab51ed49eec53e07f18d5629d817
    profiles: [antivirus]
    restart: unless-stopped
    volumes: [clamdata:/var/lib/clamav]
  nginx:
    networks:
      ingress:
        ipv4_address: ${NGINX_INGRESS_IP:-172.30.85.2}
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    image: nginx:stable-alpine@sha256:985220252f3863977e468f611ef118ebd01421289dd86ee1ae99cb068c3bce2b
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/main.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./nginx/certs:/etc/letsencrypt:ro
    depends_on: [app]
volumes:
  pgdata18: {}
  # PostgreSQL 16 data before Support Pro on PostgreSQL 18; kept for rollback.
  pgdata: {}
  redisdata: {}
  uploads: {}
  clamdata: {}

networks:
  ingress:
    internal: true
    ipam:
      config:
        - subnet: ${INGRESS_SUBNET:-172.30.85.0/29}
