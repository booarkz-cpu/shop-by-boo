services:
  volume_init:
    image: ${REDIS_IMAGE:-redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499}
    user: "0:0"
    restart: "no"
    entrypoint: ["sh", "-c", "chown -R 10001:10001 /owned"]
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    volumes:
      - media_data:/owned/media
      - app_packages:/owned/app-packages
      - backup_data:/owned/backups
      - support_uploads:/owned/uploads
      - caddy_data:/owned/caddy-data
      - caddy_config:/owned/caddy-config

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: ["sh", "-c", 'exec docker-entrypoint.sh redis-server --appendonly yes --save 60 1000 --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.50

  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea}
    restart: unless-stopped
    environment:
      POSTGRES_USER: vpnshop
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: vpnshop
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpnshop -d vpnshop"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.50

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9}
    networks:
      default: {}
      ingress:
        ipv4_address: ${BACKEND_INGRESS_IP:-172.30.84.3}
    restart: unless-stopped
    env_file: .env
    environment:
      MEDIA_DIR: /data/media
      BACKUPS_DIR: /data/backups
      PROJECT_DIR: /project
      TRUSTED_PROXY_CIDRS: ${CADDY_INGRESS_IP:-172.30.84.2}/32
      SUPPORT_PRO_URL: ${SUPPORT_PRO_URL:-}
      SUPPORT_PRO_SSO_SECRET: ${SUPPORT_PRO_SSO_SECRET:-}
      SUPPORT_PRO_TIMEOUT_SECONDS: ${SUPPORT_PRO_TIMEOUT_SECONDS:-4}
    depends_on:
      volume_init: {condition: service_completed_successfully}
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/data/media
      - app_packages:/data/app-packages
      - .:/project:ro
      - backup_data:/data/backups
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\", timeout=3)' "]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 768m
    cpus: 1.50

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9}
    restart: unless-stopped
    command: ["python", "worker.py"]
    env_file: .env
    environment:
      WORKER_ROLE: worker
      MEDIA_DIR: /data/media
      BACKUPS_DIR: /data/backups
      PROJECT_DIR: /project
      TRUSTED_PROXY_CIDRS: ${CADDY_INGRESS_IP:-172.30.84.2}/32
    depends_on:
      volume_init: {condition: service_completed_successfully}
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - media_data:/data/media
      - app_packages:/data/app-packages
      - .:/project:ro
      - backup_data:/data/backups
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    cpus: 1.00

  mail_receiver:
    # Receive-only MX for the shop's service addresses (docs/ru/MAIL_RECEIVER_CURRENT.md).
    # Started only with: docker compose --profile mail up -d mail_receiver
    profiles: ["mail"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9}
    restart: unless-stopped
    command: ["python", "-m", "app.mail_receiver"]
    env_file: .env
    environment:
      WORKER_ROLE: mail
      MAIL_RECEIVER_ENABLED: "true"
      MAIL_RECEIVER_PORT: "2525"
    ports:
      - "${MAIL_RECEIVER_PUBLISH:-25}:2525"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./deploy/mail-tls:/tls:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    cpus: 0.50

  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile.bot
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9}
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402}
        NGINX_BASE_IMAGE: ${NGINX_BASE_IMAGE:-nginx:1.29-alpine}
        VITE_API_URL: ""
    user: "101:101"
    cap_drop: [ALL]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    command: ["/bin/sh", "-c", "mkdir -p /tmp/nginx/client_temp /tmp/nginx/proxy_temp /tmp/nginx/fastcgi_temp /tmp/nginx/uwsgi_temp /tmp/nginx/scgi_temp && chmod 1777 /tmp/nginx /tmp/nginx/client_temp /tmp/nginx/proxy_temp /tmp/nginx/fastcgi_temp /tmp/nginx/uwsgi_temp /tmp/nginx/scgi_temp && exec nginx -g 'daemon off;'"]
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /run
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  miniapp:
    build:
      context: .
      dockerfile: miniapp/Dockerfile
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402}
        NGINX_BASE_IMAGE: ${NGINX_BASE_IMAGE:-nginx:1.29-alpine}
        VITE_API_URL: ""
    user: "101:101"
    cap_drop: [ALL]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    command: ["/bin/sh", "-c", "mkdir -p /tmp/nginx/client_temp /tmp/nginx/proxy_temp /tmp/nginx/fastcgi_temp /tmp/nginx/uwsgi_temp /tmp/nginx/scgi_temp && chmod 1777 /tmp/nginx /tmp/nginx/client_temp /tmp/nginx/proxy_temp /tmp/nginx/fastcgi_temp /tmp/nginx/uwsgi_temp /tmp/nginx/scgi_temp && exec nginx -g 'daemon off;'"]
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /run
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  cabinet:
    build:
      context: ./cabinet
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402}
        NGINX_BASE_IMAGE: ${NGINX_BASE_IMAGE:-nginx:1.29-alpine}
        VITE_API_URL: ""
    user: "101:101"
    cap_drop: [ALL]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    command: ["/bin/sh", "-c", "mkdir -p /tmp/nginx/client_temp /tmp/nginx/proxy_temp /tmp/nginx/fastcgi_temp /tmp/nginx/uwsgi_temp /tmp/nginx/scgi_temp && chmod 1777 /tmp/nginx /tmp/nginx/client_temp /tmp/nginx/proxy_temp /tmp/nginx/fastcgi_temp /tmp/nginx/uwsgi_temp /tmp/nginx/scgi_temp && exec nginx -g 'daemon off;'"]
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /run
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  support_db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_DB: support
      POSTGRES_USER: support
      POSTGRES_PASSWORD: ${SUPPORT_PRO_DB_PASSWORD:?set SUPPORT_PRO_DB_PASSWORD in .env}
    volumes:
      - support_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  support_redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${SUPPORT_REDIS_PASSWORD:?set SUPPORT_REDIS_PASSWORD in .env}
    command: ["sh", "-c", 'exec docker-entrypoint.sh redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - support_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  support_migrate:
    build:
      context: ./support-pro
      dockerfile: app/Dockerfile
    restart: 'no'
    env_file: ./support-pro/.env
    environment:
      POSTGRES_HOST: support_db
      POSTGRES_USER: support
      POSTGRES_PASSWORD: ${SUPPORT_PRO_DB_PASSWORD:?set SUPPORT_PRO_DB_PASSWORD in .env}
      POSTGRES_DB: support
      REDIS_URL: redis://support_redis:6379/0
      REDIS_PASSWORD: ${SUPPORT_REDIS_PASSWORD:?set SUPPORT_REDIS_PASSWORD in .env}
      SSO_SECRET: ${SUPPORT_PRO_SSO_SECRET:?set SUPPORT_PRO_SSO_SECRET in .env}
      PUBLIC_ORIGIN: ${SUPPORT_PRO_PUBLIC_ORIGIN:-}
    command: ["python", "-m", "app.migrate"]
    depends_on:
      support_db: {condition: service_healthy}

  support_pro:
    build:
      context: ./support-pro
      dockerfile: app/Dockerfile
    networks:
      default: {}
      ingress:
        ipv4_address: ${SUPPORT_INGRESS_IP:-172.30.84.4}
    restart: unless-stopped
    env_file: ./support-pro/.env
    environment:
      TRUSTED_PROXY_CIDRS: ${CADDY_INGRESS_IP:-172.30.84.2}/32
      POSTGRES_HOST: support_db
      POSTGRES_USER: support
      POSTGRES_PASSWORD: ${SUPPORT_PRO_DB_PASSWORD:?set SUPPORT_PRO_DB_PASSWORD in .env}
      POSTGRES_DB: support
      REDIS_URL: redis://support_redis:6379/0
      REDIS_PASSWORD: ${SUPPORT_REDIS_PASSWORD:?set SUPPORT_REDIS_PASSWORD in .env}
      SSO_SECRET: ${SUPPORT_PRO_SSO_SECRET:?set SUPPORT_PRO_SSO_SECRET in .env}
      PUBLIC_ORIGIN: ${SUPPORT_PRO_PUBLIC_ORIGIN:-}
      COOKIE_SECURE: "true"
    volumes:
      - support_uploads:/data/uploads
    expose:
      - "8000"
    depends_on:
      volume_init: {condition: service_completed_successfully}
      support_migrate: {condition: service_completed_successfully}
      support_redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      start_period: 90s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  support_worker:
    build:
      context: ./support-pro
      dockerfile: app/Dockerfile
    restart: unless-stopped
    env_file: ./support-pro/.env
    environment:
      POSTGRES_HOST: support_db
      POSTGRES_USER: support
      POSTGRES_PASSWORD: ${SUPPORT_PRO_DB_PASSWORD:?set SUPPORT_PRO_DB_PASSWORD in .env}
      POSTGRES_DB: support
      REDIS_URL: redis://support_redis:6379/0
      REDIS_PASSWORD: ${SUPPORT_REDIS_PASSWORD:?set SUPPORT_REDIS_PASSWORD in .env}
      SSO_SECRET: ${SUPPORT_PRO_SSO_SECRET:?set SUPPORT_PRO_SSO_SECRET in .env}
    command: ["python", "-m", "app.worker"]
    volumes:
      - support_uploads:/data/uploads
    depends_on:
      volume_init: {condition: service_completed_successfully}
      support_migrate: {condition: service_completed_successfully}
      support_redis: {condition: service_healthy}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  caddy:
    build:
      context: ./deploy/caddy
      args:
        CADDY_BASE_IMAGE: ${CADDY_IMAGE:-caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d}
    networks:
      default: {}
      ingress:
        ipv4_address: ${CADDY_INGRESS_IP:-172.30.84.2}
    user: "10001:10001"
    cap_drop: [ALL]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    restart: unless-stopped
    environment:
      SUPPORT_UPSTREAM: ${SUPPORT_INGRESS_IP:-172.30.84.4}:8000
      BACKEND_UPSTREAM: ${BACKEND_INGRESS_IP:-172.30.84.3}:8000
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?set ADMIN_DOMAIN in .env}
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
      CABINET_DOMAIN: ${CABINET_DOMAIN:?set CABINET_DOMAIN in .env}
      SUPPORT_PRO_DOMAIN: ${SUPPORT_PRO_DOMAIN:?set SUPPORT_PRO_DOMAIN in .env}
    depends_on:
      volume_init: {condition: service_completed_successfully}
      backend:
        condition: service_healthy
      admin:
        condition: service_healthy
      miniapp:
        condition: service_healthy
      cabinet:
        condition: service_healthy
      support_pro:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true

volumes:
  redis_data:
  backup_data:
  postgres_data:
  media_data:
  app_packages:
  support_postgres_data:
  support_redis_data:
  support_uploads:
  caddy_data:
  caddy_config:

networks:
  ingress:
    internal: true
    ipam:
      config:
        - subnet: ${INGRESS_SUBNET:-172.30.84.0/29}
