name: Android client app

# v28.79.0 (stage 18): «Корги Люси: клиент» (apps/vpn-client/android) — the third, standalone Android app. Unit tests of
# the link parser and the config builder, debug and release builds, and the VPN on an emulator through Xray-core to an
# Xray server on the runner (scripts/mobile/client-vpn-e2e.sh). The customer and administrator apps are not built here.
on:
  pull_request:
    paths: ['apps/vpn-client/android/**', 'scripts/mobile/client-vpn-e2e.sh', 'scripts/mobile/client-ktlint.sh', 'scripts/mobile/build-xray-aar.sh', 'scripts/mobile/xray-artifact.py', 'scripts/ci/gradle-warm.sh', '.github/workflows/android-client.yml']
  push:
    branches: [main]
    paths: ['apps/vpn-client/android/**', 'scripts/mobile/client-vpn-e2e.sh', 'scripts/mobile/client-ktlint.sh', 'scripts/mobile/build-xray-aar.sh', 'scripts/mobile/xray-artifact.py', 'scripts/ci/gradle-warm.sh', '.github/workflows/android-client.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Android client • tests, builds, VPN on an emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          problem-matcher: true
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: "platform-tools platforms;android-35 platforms;android-37.1 build-tools;35.0.0"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false
      # The same engine as the customer app (same cache): consumed directly from apps/vpn-shop/android/app/libs.
      - id: xray
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/vpn-shop/android/app/libs/libv2ray.aar
          key: xray-aar-${{ hashFiles('scripts/mobile/build-xray-aar.sh', 'scripts/mobile/xray-artifact.py') }}
      - name: Build the VPN engine (libv2ray.aar)
        if: steps.xray.outputs.cache-hit != 'true'
        run: bash scripts/mobile/build-xray-aar.sh
      - name: ktlint (main screen, view model and their tests)
        run: bash scripts/mobile/client-ktlint.sh
      - name: Use a clean Gradle dependency cache for the client
        run: |
          gradle_dir="$(mktemp -d "$RUNNER_TEMP/gradle-client.XXXXXX")"
          printf 'GRADLE_USER_HOME=%s\n' "$gradle_dir" >> "$GITHUB_ENV"
      - name: Unit tests, debug and release builds
        run: |
          set -euo pipefail
          bash scripts/ci/gradle-warm.sh --exec apps/vpn-client/android -- \
            :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest --no-daemon
          bash scripts/mobile/build-xray-aar.sh --verify-apk \
            apps/vpn-client/android/app/build/outputs/apk/debug/app-debug.apk \
            apps/vpn-client/android/app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: android-client-unit-tests
          path: apps/vpn-client/android/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
      - name: Xray server for the runner (latest release, SHA-256 from its .dgst)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xray" && cd "$RUNNER_TEMP/xray"
          gh release download --repo XTLS/Xray-core --pattern 'Xray-linux-64.zip' --pattern 'Xray-linux-64.zip.dgst'
          want="$(sed -n 's/^SHA2-256= *//p' Xray-linux-64.zip.dgst | head -1)"
          echo "$want  Xray-linux-64.zip" | sha256sum -c -
          unzip -q Xray-linux-64.zip xray && chmod +x xray && ./xray version | sed -n 1p
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Import the subscription, connect, reach the page through the tunnel, disconnect; UI tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          # No Google services are needed: avoid Nexus Launcher ANR stealing window focus.
          target: default
          profile: pixel_6
          disable-animations: true
          cores: 4
          ram-size: 4096M
          # A UI test that never ends is stopped after 25 minutes, and the log names the test that was running.
          # The UI tests also save screens of the main views (ClientScreensTest.shot): pulled for the artifact below.
          script: bash scripts/mobile/client-ui-e2e.sh
      # Job logs show only «there were failing tests»: print which and why (the XML results of the UI tests).
      - name: UI test failures
        if: failure()
        run: |
          for f in apps/vpn-client/android/app/build/outputs/androidTest-results/connected/debug/*.xml; do
            [ -f "$f" ] || continue
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for case in ET.parse(sys.argv[1]).iter("testcase"):
              for bad in list(case.iter("failure")) + list(case.iter("error")):
                  text = (bad.text or bad.get("message") or "").strip().splitlines()
                  print(f"::error title={case.get('name')}::" + " | ".join(text[:6])[:1500])
          PY
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: android-client-screens
          path: client-screens/
          if-no-files-found: ignore
