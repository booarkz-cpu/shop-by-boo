name: Android client app

# v28.79.0 (stage 18): «Корги Люси: клиент» (mobile/android-client) — the third, standalone Android app. Unit tests of
# the link parser and the config builder, debug and release builds, and the VPN on an emulator through Xray-core to an
# Xray server on the runner (scripts/mobile/client-vpn-e2e.sh). The customer and administrator apps are not built here.
on:
  pull_request:
    paths: ['mobile/android-client/**', 'scripts/mobile/client-vpn-e2e.sh', 'scripts/mobile/client-ktlint.sh', 'scripts/mobile/build-xray-aar.sh', '.github/workflows/android-client.yml']
  push:
    branches: [main]
    paths: ['mobile/android-client/**', 'scripts/mobile/client-vpn-e2e.sh', 'scripts/mobile/client-ktlint.sh', 'scripts/mobile/build-xray-aar.sh', '.github/workflows/android-client.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Android client • tests, builds, VPN on an emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache: false
      # The same engine as the customer app (same cache): built into mobile/android-user/app/libs, copied here.
      - id: xray
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: mobile/android-user/app/libs/libv2ray.aar
          key: xray-aar-${{ hashFiles('scripts/mobile/build-xray-aar.sh') }}
      - name: Build the VPN engine (libv2ray.aar)
        if: steps.xray.outputs.cache-hit != 'true'
        run: bash scripts/mobile/build-xray-aar.sh
      - name: ktlint (main screen, view model and their tests)
        run: bash scripts/mobile/client-ktlint.sh
      - name: Gradle distribution (retries on GitHub 504)
        run: bash scripts/ci/gradle-warm.sh mobile/android-client
      - name: Unit tests, debug and release builds
        run: |
          set -euo pipefail
          mkdir -p mobile/android-client/app/libs
          cp mobile/android-user/app/libs/libv2ray.aar mobile/android-client/app/libs/
          cd mobile/android-client
          bash gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --no-daemon
          ls -l app/build/outputs/apk/debug app/build/outputs/apk/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: android-client-unit-tests
          path: mobile/android-client/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
      - name: Xray server for the runner (latest release, SHA-256 from its .dgst)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xray" && cd "$RUNNER_TEMP/xray"
          gh release download --repo XTLS/Xray-core --pattern 'Xray-linux-64.zip' --pattern 'Xray-linux-64.zip.dgst'
          want="$(sed -n 's/^SHA2-256= *//p' Xray-linux-64.zip.dgst | head -1)"
          echo "$want  Xray-linux-64.zip" | sha256sum -c -
          unzip -q Xray-linux-64.zip xray && chmod +x xray && ./xray version | head -1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Import the subscription, connect, reach the page through the tunnel, disconnect; UI tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          cores: 4
          ram-size: 4096M
          # A UI test that never ends is stopped after 25 minutes, and the log names the test that was running.
          # The UI tests also save screens of the main views (ClientScreensTest.shot): pulled for the artifact below.
          script: bash scripts/mobile/client-vpn-e2e.sh mobile/android-client/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/xray/xray" && cd mobile/android-client && (timeout 25m bash gradlew :app:connectedDebugAndroidTest --no-daemon || (adb logcat -d | grep -E "TestRunner.{2}(started|finished|failed)" | tail -n 40; adb logcat -d | grep -E "ActivityTaskManager|ActivityManager|AndroidRuntime|corgi|TestRunner|ActivityScenario" | tail -n 120; exit 1)) && (adb pull /data/local/tmp/client-screens "$GITHUB_WORKSPACE/client-screens" || echo "no screens")
      # Job logs show only «there were failing tests»: print which and why (the XML results of the UI tests).
      - name: UI test failures
        if: failure()
        run: |
          for f in mobile/android-client/app/build/outputs/androidTest-results/connected/debug/*.xml; do
            [ -f "$f" ] || continue
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for case in ET.parse(sys.argv[1]).iter("testcase"):
              for bad in list(case.iter("failure")) + list(case.iter("error")):
                  text = (bad.text or bad.get("message") or "").strip().splitlines()
                  print(f"::error title={case.get('name')}::" + " | ".join(text[:6])[:1500])
          PY
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: android-client-screens
          path: client-screens/
          if-no-files-found: ignore
