name: Corgi Lusi Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Same rule as ci.yml: only a retry of the same commit supersedes an earlier run. The release gate
# needs a successful Docker run on the exact release commit, so a re-run of another commit must not
# cancel it.
concurrency:
  group: docker-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build and publish containers
    runs-on: ubuntu-24.04
    needs: security
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: bot
            context: ./backend
            dockerfile: ./backend/Dockerfile.bot
          - name: admin
            context: .
            dockerfile: ./admin/Dockerfile
          - name: cabinet
            context: ./cabinet
            dockerfile: ./cabinet/Dockerfile
          - name: miniapp
            context: .
            dockerfile: ./miniapp/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Select release channel
        id: channel
        run: |
          python3 - <<'PYTHON'
          import json, os
          preview = bool(json.load(open('release-manifest.template.json')).get('prerelease'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"stable={str(not preview).lower()}\npreview={str(preview).lower()}\n")
          PYTHON
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/shop-by-boo-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ steps.channel.outputs.stable == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
            type=raw,value=preview,enable=${{ steps.channel.outputs.preview == 'true' && github.ref == 'refs/heads/main' }}
      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Dependency security audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt
          pip-audit -r support-pro/requirements.txt
          pip-audit -r support-pro/requirements-dev.txt
      - name: npm audit
        run: |
          for dir in admin miniapp cabinet; do
            (cd "$dir" && npm audit --audit-level=high)
          done
