name: Mobile packages

on:
  pull_request:
    paths: ['release-manifest.template.json', 'mobile/**', 'scripts/build-android-apk.sh', 'scripts/build-ios-*.sh', '.github/workflows/mobile-release.yml']
  push:
    branches: [main]
    paths: ['release-manifest.template.json', 'mobile/**', 'scripts/build-android-apk.sh', 'scripts/build-ios-*.sh', '.github/workflows/mobile-release.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - id: xray
        uses: actions/cache@v4
        with:
          path: mobile/android-user/app/libs/libv2ray.aar
          key: xray-aar-${{ hashFiles('scripts/mobile/build-xray-aar.sh') }}
      - name: Build the embedded VPN engine (libv2ray.aar)
        if: steps.xray.outputs.cache-hit != 'true'
        run: bash scripts/mobile/build-xray-aar.sh
      - name: Build and verify release variant
        env:
          KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          set -Eeuo pipefail
          mkdir -p dist/mobile
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            export ANDROID_KEYSTORE="$RUNNER_TEMP/mobile-release.jks"
            trap 'rm -f "$ANDROID_KEYSTORE"' EXIT
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE"
            export ANDROID_BUILD_MODE=release
            state=signed
          else
            test -z "$ANDROID_KEYSTORE_PASSWORD$ANDROID_KEY_ALIAS$ANDROID_KEY_PASSWORD" || { echo 'Incomplete Android signing configuration'; exit 1; }
            export ANDROID_BUILD_MODE=verify-release
            state=blocked_missing_signing_key
          fi
          bash scripts/build-android-apk.sh "$PWD/dist/mobile"
          for apk in dist/mobile/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "$apk.package.txt"
            grep -q "versionCode='3400'" "$apk.package.txt"
            grep -q "versionName='3.4.0'" "$apk.package.txt"
            if grep -q 'application-debuggable' "$apk.package.txt"; then echo 'Debuggable release rejected'; exit 1; fi
            if [[ "$state" == signed ]]; then
              "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > "$apk.certificate.txt"
              if grep -q 'CN=Android Debug' "$apk.certificate.txt"; then echo 'Debug signing certificate rejected'; exit 1; fi
            fi
          done
          printf '%s\n' "$state" > dist/mobile/android-status.txt
          echo "Android production: $state" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: mobile-android
          path: dist/mobile/
          if-no-files-found: error
          retention-days: 14

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        if: github.event_name != 'pull_request'
        with:
          go-version: stable
          cache: false
      - id: tunnel-frameworks
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: mobile/ios-user/Frameworks
          key: ios-tunnel-${{ hashFiles('scripts/ios/build-tunnel-frameworks.sh') }}
      - name: Build the iOS tunnel engine when its profile is configured
        if: github.event_name != 'pull_request' && steps.tunnel-frameworks.outputs.cache-hit != 'true'
        env:
          HAS_TUNNEL_PROFILE: ${{ secrets.IOS_USER_TUNNEL_PROFILE_BASE64 != '' }}
        run: |
          if [[ "$HAS_TUNNEL_PROFILE" == true ]]; then bash scripts/ios/build-tunnel-frameworks.sh; else echo "No tunnel profile: the app keeps handing the subscription to a VPN client"; fi
      - name: Verify device and simulator builds
        run: bash scripts/build-ios-packages.sh "$PWD/dist/mobile"
      - name: Sign production packages when owner identity is configured
        env:
          IOS_CERTIFICATE_BASE64: ${{ github.event_name != 'pull_request' && secrets.IOS_CERTIFICATE_BASE64 || '' }}
          IOS_CERTIFICATE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.IOS_CERTIFICATE_PASSWORD || '' }}
          IOS_USER_PROFILE_BASE64: ${{ github.event_name != 'pull_request' && secrets.IOS_USER_PROFILE_BASE64 || '' }}
          IOS_ADMIN_PROFILE_BASE64: ${{ github.event_name != 'pull_request' && secrets.IOS_ADMIN_PROFILE_BASE64 || '' }}
          IOS_TEAM_ID: ${{ github.event_name != 'pull_request' && secrets.IOS_TEAM_ID || '' }}
          # Optional: profiles of the app extensions (shop.remnawave.user.push / .tunnel).
          IOS_USER_PUSH_PROFILE_BASE64: ${{ github.event_name != 'pull_request' && secrets.IOS_USER_PUSH_PROFILE_BASE64 || '' }}
          IOS_USER_TUNNEL_PROFILE_BASE64: ${{ github.event_name != 'pull_request' && secrets.IOS_USER_TUNNEL_PROFILE_BASE64 || '' }}
          IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'release-testing' }}
        run: |
          set -Eeuo pipefail
          if [[ -n "$IOS_CERTIFICATE_BASE64" ]]; then
            bash scripts/build-ios-signed.sh "$PWD/dist/mobile"
            state=signed
          else
            test -z "$IOS_CERTIFICATE_PASSWORD$IOS_USER_PROFILE_BASE64$IOS_ADMIN_PROFILE_BASE64$IOS_TEAM_ID" || { echo 'Incomplete Apple signing configuration'; exit 1; }
            state=blocked_missing_apple_identity
          fi
          printf '%s\n' "$state" > dist/mobile/ios-status.txt
          echo "iOS production: $state" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: mobile-ios
          path: dist/mobile/
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [android, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: mobile-*
          merge-multiple: true
          path: dist/mobile
      - name: Verify package checksums
        run: |
          cd dist/mobile
          for checksum in *.sha256; do sha256sum -c "$checksum"; done
      - name: Require CI and attach only signed production packages
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const args = {owner: context.repo.owner, repo: context.repo.repo};
            const manifest = JSON.parse(fs.readFileSync('release-manifest.template.json','utf8'));
            // `version` is the runtime version; GitHub source releases use the distribution tag.
            const tag = manifest.distribution_tag;
            if (!/^v\d+\.\d+\.\d+(?:-(?:alpha|beta|rc)\.\d+)?$/.test(tag)) throw new Error('Invalid source distribution tag');
            // This workflow may run for later maintenance commits. Only the
            // release's own source commit can publish assets to its tag.
            const main = await github.rest.repos.getBranch({...args, branch: 'main'});
            if (main.data.commit.sha !== context.sha) {
              core.notice('Main moved; packages remain available as workflow artifacts.');
              return;
            }
            let release;
            // The release appears only after CI, Docker and «Publish GitHub release» finish (about 30–50 minutes).
            for (let i = 0; i < 420; i++) {
              const main = await github.rest.repos.getBranch({...args, branch: 'main'});
              if (main.data.commit.sha !== context.sha) {
                core.notice('Main moved; packages remain as workflow artifacts.');
                return;
              }
              const runs = await github.rest.actions.listWorkflowRuns({...args, workflow_id:'ci.yml', head_sha:context.sha, event:'push', per_page:10});
              const run = runs.data.workflow_runs.find(r => r.head_sha === context.sha && r.event === 'push');
              if (run?.status === 'completed' && run.conclusion !== 'success') throw new Error('Main CI failed.');
              if (run?.conclusion === 'success') {
                try { release = (await github.rest.repos.getReleaseByTag({...args, tag})).data; }
                catch (e) { if (e.status !== 404) throw e; }
                if (release && !release.draft) {
                  let ref = (await github.rest.git.getRef({...args, ref:`tags/${tag}`})).data.object;
                  if (ref.type === 'tag') ref = (await github.rest.git.getTag({...args, tag_sha:ref.sha})).data.object;
                  if (ref.type !== 'commit' || ref.sha !== context.sha) {
                    core.notice('Release tag belongs to another commit; packages remain available as workflow artifacts.');
                    return;
                  }
                  break;
                }
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            if (!release || release.draft) {
              // A commit that does not raise the version publishes no release: nothing to attach, not an error.
              const pub = await github.rest.actions.listWorkflowRuns({...args, workflow_id:'publish-release.yml', head_sha:context.sha, per_page:10});
              if (pub.data.workflow_runs.some(r => r.status === 'completed' && r.conclusion === 'success')) {
                core.notice('No release for this commit; packages remain available as workflow artifacts.');
                return;
              }
              throw new Error('Verified source release is not available.');
            }
            const android = fs.readFileSync('dist/mobile/android-status.txt','utf8').trim();
            const ios = fs.readFileSync('dist/mobile/ios-status.txt','utf8').trim();
            const gradle = fs.readFileSync('mobile/android-user/app/build.gradle.kts','utf8');
            const mobileVersion = gradle.match(/versionName = "([0-9.]+)"/)[1];
            const v = mobileVersion.replace(/\./g, '_');
            const status = {version:mobileVersion, source_commit:context.sha, workflow_run:context.runId,
              android, ios, note:'Unsigned and preview packages are never production release assets.'};
            fs.writeFileSync('dist/mobile/mobile-production-status.json', JSON.stringify(status,null,2)+'\n');
            const names = fs.readdirSync('dist/mobile').filter(name =>
              name === 'mobile-production-status.json' ||
              (android === 'signed' && new RegExp(`^corgi_lusi_android_(user|admin)_${v}_release\\.(?:apk|aab)(?:\\.(?:sha256|certificate\\.txt|package\\.txt))?$`).test(name)) ||
              (ios === 'signed' && new RegExp(`^corgi_lusi_ios_(user|admin)_${v}_signed\\.ipa(?:\\.sha256)?$`).test(name)));
            const existing = (await github.rest.repos.listReleaseAssets({...args, release_id:release.id, per_page:100})).data;
            for (const name of names) {
              const old = existing.find(a => a.name === name);
              const data = fs.readFileSync(`dist/mobile/${name}`);
              const expectedDigest = 'sha256:' + require('crypto').createHash('sha256').update(data).digest('hex');
              if (old && old.digest === expectedDigest && old.size === data.length) continue;
              if (old && name !== 'mobile-production-status.json') throw new Error(`Asset differs; refusing to replace ${name}`);
              if (old) await github.rest.repos.deleteReleaseAsset({...args, asset_id:old.id});
              const uploaded = (await github.rest.repos.uploadReleaseAsset({...args, release_id:release.id, name, data,
                headers:{'content-type':'application/octet-stream','content-length':data.length}})).data;
              if (uploaded.digest !== expectedDigest || uploaded.size !== data.length) throw new Error(`Upload verification failed: ${name}`);
            }
            const marker = '\n<!-- mobile-production-status -->';
            const body = release.body.split(marker)[0] + marker +
              `\n\nMobile ${mobileVersion}: Android **${android}**, iOS **${ios}**.\n`;
            await github.rest.repos.updateRelease({...args, release_id:release.id, body});
            core.summary.addRaw(`Android: ${android}; iOS: ${ios}`).write();
