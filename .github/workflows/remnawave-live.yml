name: Remnawave live contract

# The shop's Remnawave client against a real panel of the newest version (official compose, random secrets).
# Separate from «Corgi Lusi CI» on purpose: a change upstream shows up here (and weekly) without blocking releases.
on:
  pull_request:
    paths: ['backend/app/remnawave.py', 'backend/app/node_autoscale.py', 'backend/app/block_monitor.py', 'backend/app/node_health.py',
            'backend/app/rw_*.py', 'backend/app/provisioner.py', 'tests/live/**', 'scripts/ci/remnawave-live.sh',
            'scripts/ci/rw-install-live.sh', 'scripts/ci/caddy-on-demand-live.sh', 'scripts/ci/tinyauth-live.sh', 'scripts/ci/panel-gate-live.sh', 'backend/app/panel_gate.py', 'deploy/Caddyfile', 'deploy/caddy/**',
            'backend/app/sub_proxy.py', 'backend/app/sub_portal.py', 'backend/app/bot.py', 'backend/app/telegram_bot.py',
            '.github/workflows/remnawave-live.yml']
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  panel:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      APP_SECRET: ci-only-secret
      APP_ENV: test
      DATABASE_URL: sqlite+aiosqlite:///./live.db
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt -r backend/requirements-test.txt
      - name: Newest Remnawave panel and the shop's live contract tests
        run: bash scripts/ci/remnawave-live.sh

  # v28.69.0 (stage 10): the installation wizard installs «panel + node» on the runner over SSH (pinned images).
  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_SECRET: ci-only-secret
      APP_ENV: test
      DATABASE_URL: sqlite+aiosqlite:///./live.db
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt -r backend/requirements-test.txt
      - name: Install panel and node through the wizard
        run: bash scripts/ci/rw-install-live.sh

  # v28.69.0 (stage 11): the shop's Caddyfile issues on-demand certificates only for Domain Manager portal domains.
  caddy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_SECRET: ci-only-secret
      APP_ENV: test
      DATABASE_URL: sqlite+aiosqlite:///./live.db
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt -r backend/requirements-test.txt
      - name: On-demand certificates of portal domains
        run: bash scripts/ci/caddy-on-demand-live.sh

  # v28.78.0 (stage 18): «Доступ к панели → Вход через TinyAuth» — the wizard's files with the real TinyAuth and Caddy.
  tinyauth:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_SECRET: ci-only-secret
      APP_ENV: test
      DATABASE_URL: sqlite+aiosqlite:///./live.db
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt -r backend/requirements-test.txt
      - name: TinyAuth in front of the panel
        run: bash scripts/ci/tinyauth-live.sh
      - name: The shop's own login in front of the panel
        run: bash scripts/ci/panel-gate-live.sh

  # v28.70.0 (stage 12): SelfSteal node through the wizard with the shop connected to the newest panel; a TLS client
  # without REALITY keys gets the template site on port 443; IPv6 and the Xray core modules on the same node.
  node-modules:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_SECRET: ci-only-secret
      APP_ENV: test
      DATABASE_URL: sqlite+aiosqlite:///./live.db
      GH_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt -r backend/requirements-test.txt
      - name: Newest panel (official compose, no Caddy)
        run: PANEL_ONLY_ENV="$RUNNER_TEMP/panel.env" bash scripts/ci/remnawave-live.sh
      - name: SelfSteal node and node modules through the wizard
        run: |
          set -a; . "$RUNNER_TEMP/panel.env"; set +a
          RW_LIVE_TEST=tests/live/test_node_modules_live.py bash scripts/ci/rw-install-live.sh

  # v28.71.0 (stage 13): the shop's bot against the real Telegram Bot API with the owner's test bot
  # (Actions secret TELEGRAM_TEST_BOT_TOKEN; without it the test is skipped — BLOCKED_SECRETS).
  telegram:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      APP_SECRET: ci-only-secret
      APP_ENV: test
      DATABASE_URL: sqlite+aiosqlite:///./live.db
      TELEGRAM_TEST_BOT_TOKEN: ${{ secrets.TELEGRAM_TEST_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt -r backend/requirements-test.txt
      - name: Bot against the Telegram Bot API
        run: |
          python -m pytest -q -s -rs tests/live/test_telegram_live.py -p no:cacheprovider
          if [ -z "$TELEGRAM_TEST_BOT_TOKEN" ]; then echo "Telegram: BLOCKED_SECRETS (no TELEGRAM_TEST_BOT_TOKEN)" >> "$GITHUB_STEP_SUMMARY"; fi
