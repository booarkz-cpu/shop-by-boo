name: zz swift 6 check (scratch, never merged)
on:
  push:
    branches: ['scratch/swift']
permissions:
  contents: write
jobs:
  swift6:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Build with complete concurrency checking
        run: |
          set +e
          mkdir -p _swift
          for spec in "ios-user VpnShopUser" "ios-admin VpnShopAdmin"; do
            set -- $spec
            (cd mobile/$1 && xcodebuild -project $2.xcodeproj -scheme $2 -sdk iphonesimulator -configuration Debug -destination "generic/platform=iOS Simulator" ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO SWIFT_VERSION=5.0 SWIFT_STRICT_CONCURRENCY=complete build > "$GITHUB_WORKSPACE/_swift/$1.txt" 2>&1; echo "exit=$?" >> "$GITHUB_WORKSPACE/_swift/$1.txt")
            grep -E "error:|warning:.*([Ss]endable|isolat|concurren|actor|data race|Swift 6)" "_swift/$1.txt" | sort -u > "_swift/$1-errors.txt" || true
            echo "$1: $(grep -c 'error:' _swift/$1-errors.txt) errors"
          done
          xcodebuild -version > _swift/xcode.txt
      - name: Publish result as a tag
        if: always()
        run: |
          git config user.name q; git config user.email q@example.test
          git rm -q --cached .github/workflows/zz-swift.yml >/dev/null 2>&1 || true
          git add -f _swift && git commit -qm "swift 6 result" --no-verify || true
          git tag "swift-${GITHUB_SHA::12}" && git push -q origin "refs/tags/swift-${GITHUB_SHA::12}"
