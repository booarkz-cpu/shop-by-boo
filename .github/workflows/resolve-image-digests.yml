name: Resolve image digests

# Prints the immutable digests (and the program versions inside) of the base images this project pins.
# Used when the pinned images are updated; the sandbox that prepares the change cannot reach Docker Hub.
on:
  pull_request:
    paths: ['.github/workflows/resolve-image-digests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Resolve
        run: |
          check(){
            local image="$1" cmd="$2" digest version
            docker pull -q "$image" >/dev/null
            digest="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
            version="$(docker run --rm --entrypoint sh "$image" -c "$cmd" 2>&1 | head -1)"
            echo "IMAGE $image | $digest | $version" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          check python:3.14-slim 'python3 --version'
          check node:26-alpine 'node --version'
          check nginx:1.30-alpine 'nginx -v'
          check caddy:2.11-alpine 'caddy version'
          check redis:8.10-alpine 'redis-server --version'
          check postgres:18.6-alpine 'postgres --version'
          label(){ docker pull -q "$1" >/dev/null; echo "IMAGE $1 | $(docker image inspect "$1" --format '{{index .RepoDigests 0}}') | $(docker image inspect "$1" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" | tee -a "$GITHUB_STEP_SUMMARY"; }
          label remnawave/backend:3
          label remnawave/node:latest
          label remnawave/subscription-page:latest
          check postgres:18.4 'postgres --version'
          check valkey/valkey:9-alpine 'valkey-server --version'
          # v28.99.0 (N7): the image psiphond is built in on the node (Go of psiphon-tunnel-core's go.mod, with git).
          check golang:1.26-bookworm 'go version'
          # v28.94.0 (N7): MTProto proxy for Telegram (9seconds/mtg, MIT). The image has no shell: the version comes from the binary.
          docker pull -q nineseconds/mtg:2 >/dev/null
          echo "IMAGE nineseconds/mtg:2 | $(docker image inspect nineseconds/mtg:2 --format '{{index .RepoDigests 0}}') | $(docker run --rm nineseconds/mtg:2 --version 2>&1 | head -1)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Android toolchain versions
        run: |
          meta(){ curl -fsS "$1" | grep -oE "<version>[^<]+" | sed 's/<version>//' | grep -viE "alpha|beta|rc|dev|eap|snapshot|-m[0-9]" | sort -V | tail -1; }
          echo "TOOL AGP $(meta https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/maven-metadata.xml)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "TOOL Kotlin $(meta https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-gradle-plugin/maven-metadata.xml)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "TOOL ComposeBOM $(meta https://dl.google.com/dl/android/maven2/androidx/compose/compose-bom/maven-metadata.xml)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "TOOL Gradle $(curl -fsS https://services.gradle.org/versions/current | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["version"], d["downloadUrl"], d.get("checksumUrl",""))')" | tee -a "$GITHUB_STEP_SUMMARY"
          for a in androidx.activity/activity-compose androidx.biometric/biometric androidx.credentials/credentials androidx.credentials/credentials-play-services-auth androidx.test.ext/junit androidx.test/core-ktx androidx.test/runner com.google.android.play/integrity com.google.firebase/firebase-messaging; do
            g=${a%%/*}; n=${a##*/}; echo "TOOL $a $(meta https://dl.google.com/dl/android/maven2/${g//.//}/$n/maven-metadata.xml)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo "TOOL kotlinx-coroutines-android $(meta https://repo1.maven.org/maven2/org/jetbrains/kotlinx/kotlinx-coroutines-android/maven-metadata.xml)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "TOOL compose-compiler-plugin $(meta https://repo1.maven.org/maven2/org/jetbrains/kotlin/plugin/compose/org.jetbrains.kotlin.plugin.compose.gradle.plugin/maven-metadata.xml)" | tee -a "$GITHUB_STEP_SUMMARY"
          ls /usr/local/lib/android/sdk/platforms | sed 's/^/TOOL sdk-platform /'
