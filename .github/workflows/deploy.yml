name: Corgi Lusi Production Deploy

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact published stable tag (for example v21.0.0)
        required: true
        type: string
  # Automatic deployment after a stable release is published, when the owner turns it on with the
  # repository variable AUTO_DEPLOY=true (Settings → Secrets and variables → Actions → Variables).
  # Releases are published with GITHUB_TOKEN, which raises no «release» event: follow the
  # publishing workflow instead. The «production» environment can still require a reviewer.
  workflow_run:
    workflows: ["Publish GitHub release"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy verified release over SSH
    if: github.event_name == 'workflow_dispatch' || (vars.AUTO_DEPLOY == 'true' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Validate published stable release
        id: release
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        with:
          script: |
            let tag = process.env.RELEASE_TAG;
            if (!tag) {
              // Automatic run: only a stable release that the publishing run just created; a run that
              // published nothing new (same version) deploys nothing.
              const latest = (await github.rest.repos.getLatestRelease({owner: context.repo.owner, repo: context.repo.repo})).data;
              const started = new Date(context.payload.workflow_run.run_started_at || context.payload.workflow_run.created_at);
              if (new Date(latest.published_at) < started) {
                core.notice(`No new release published by this run (latest is ${latest.tag_name}); nothing to deploy.`);
                core.setOutput('skip', 'true');
                return;
              }
              tag = latest.tag_name;
            }
            core.setOutput('tag', tag);
            if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error('An exact stable release tag is required');
            const release = (await github.rest.repos.getReleaseByTag({owner: context.repo.owner, repo: context.repo.repo, tag})).data;
            if (release.draft || release.prerelease) throw new Error('Production refuses draft and prerelease releases');
            const artifact = `remnawave_vpn_shop_v${tag.slice(1).replaceAll('.', '_')}_full_release.zip`;
            for (const name of [artifact, `${artifact}.sha256`]) {
              if (!release.assets.some(asset => asset.name === name && asset.state === 'uploaded')) {
                throw new Error(`Release asset missing: ${name}`);
              }
            }
      - name: Check deployment secrets
        if: steps.release.outputs.skip != 'true'
        env:
          HAS_HOST: ${{ secrets.DEPLOY_HOST != '' }}
          HAS_USER: ${{ secrets.DEPLOY_USER != '' }}
          HAS_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
          HAS_PATH: ${{ secrets.DEPLOY_PATH != '' }}
        run: |
          missing=""
          [ "$HAS_HOST" = true ] || missing="$missing DEPLOY_HOST"
          [ "$HAS_USER" = true ] || missing="$missing DEPLOY_USER"
          [ "$HAS_KEY" = true ] || missing="$missing DEPLOY_SSH_KEY"
          [ "$HAS_PATH" = true ] || missing="$missing DEPLOY_PATH"
          if [ -n "$missing" ]; then
            echo "::error title=Deployment secrets missing::Add${missing} in Settings → Environments → production → Environment secrets (values: run sudo bash scripts/setup-auto-deploy.sh on the server, docs/INSTALLATION.md §9), or turn AUTO_DEPLOY off. Nothing was deployed."
            exit 1
          fi
      - name: Install exact release with backup and health checks
        if: steps.release.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.2.2
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          APP_DIR: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: RELEASE_TAG,APP_DIR
          command_timeout: 40m
          script: |
            set -eu
            test -n "$APP_DIR"
            cd "$APP_DIR"
            test -f .env
            test -f scripts/github_release_fetch.py
            grep -q RELEASE_TAG scripts/github_release_fetch.py || {
              echo 'Installed updater does not support exact release tags. Upgrade the updater before deployment.' >&2
              exit 2
            }
            bash scripts/update-from-github.sh
