name: Publish GitHub release

on:
  workflow_run:
    workflows: ["Corgi Lusi CI", "Corgi Lusi Docker"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-source-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish verified distribution
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out verified commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Require successful CI and Docker on current main
        id: gate
        uses: actions/github-script@v9
        with:
          script: |
            const repo = {owner: context.repo.owner, repo: context.repo.repo};
            const sha = context.payload.workflow_run.head_sha;
            core.setOutput('ready', 'false');
            const main = (await github.rest.repos.getBranch({...repo, branch: 'main'})).data.commit.sha;
            if (main !== sha) { core.info('Newer main will publish after its own checks.'); return; }
            for (const workflow_id of ['ci.yml', 'docker.yml']) {
              const runs = (await github.rest.actions.listWorkflowRuns({...repo, workflow_id, head_sha: sha, per_page: 100})).data.workflow_runs;
              const run = runs.filter(item => item.event === 'push' && item.head_branch === 'main').sort((a,b) => b.id-a.id)[0];
              if (!run || run.status !== 'completed' || run.conclusion !== 'success') {
                core.info(`Waiting for successful ${workflow_id} on ${sha}`); return;
              }
            }
            const verified = (await github.rest.actions.listWorkflowRuns({...repo, workflow_id: 'ci.yml', head_sha: sha, status: 'completed', per_page: 100})).data.workflow_runs;
            const evidence = verified.filter(run => run.event === 'push' && run.head_branch === 'main' && run.conclusion === 'success').sort((a,b) => a.id-b.id)[0];
            core.setOutput('ci_run', evidence.html_url);
            core.setOutput('ready', 'true');
      - name: Package deterministic distribution
        if: steps.gate.outputs.ready == 'true'
        run: |
          python3 scripts/check-current-docs.py
          python3 scripts/package-distribution.py --ci-run '${{ steps.gate.outputs.ci_run }}'
      - name: Publish verified files and dispatch tagged Docker
        if: steps.gate.outputs.ready == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const {publish} = require('./scripts/publish-github-release.cjs');
            await publish({github, context, core});
