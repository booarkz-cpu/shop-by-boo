name: Autonomous audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autonomous-audit-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  audit:
    name: Autonomous audit • complete inventory and consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Check source and documentation conditions
        run: python scripts/audit/run_full_audit.py
      - name: Verify published mobile download links
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_LIVE_RELEASE_LINK_CHECK: "1"
        run: python -m pytest -q tests/test_download_links.py -k live
      - name: Retain readable summary
        if: always()
        run: |
          if test -f artifacts/audit/FULL_AUDIT_REPORT.md; then
            cat artifacts/audit/FULL_AUDIT_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain audit results and redacted command logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: autonomous-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/audit/
          if-no-files-found: error
          retention-days: 14
