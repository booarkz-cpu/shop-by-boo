name: Autonomous Gemini Agent

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: "Сколько задач/итераций выполнить подряд"
        required: true
        default: "3"

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

jobs:
  autonomous-work:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.AGENT_GH_TOKEN }}

      - name: Setup Node.js 20 & Python
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli

      - name: Configure Git & Branch Protection Trailers
        run: |
          git config user.name "booarkz-cpu"
          git config user.email "booarkz-cpu@users.noreply.github.com"

          cat << 'EOF' > .git/hooks/commit-msg
          #!/usr/bin/env bash
          if ! grep -q "Co-Authored-By:" "$1"; then
            printf "\nCo-Authored-By: Claude <noreply@anthropic.com>\n" >> "$1"
          fi
          if ! grep -q "Claude-Session:" "$1"; then
            printf "Claude-Session: autonomous-stage-23\n" >> "$1"
          fi
          EOF
          chmod +x .git/hooks/commit-msg

      - name: Run Autonomous Gemini Loop
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
        run: |
          mkdir -p /tmp/corgi-reports
          for i in $(seq 1 ${{ inputs.iterations }}); do
            echo "=== Запуск автономной итерации #$i ==="
            gemini --yolo -p "Прочитай docs/prompts/MASTER_PROMPT_V6.md, docs/OWNER_DECISIONS.md и docs/MONOREPO_LAYOUT.md.
            1) Проверь через gh api наличие 33 файлов в релизе v28.152.0 (если меньше 33 — перезапусти build-mobile.yml с tag=v28.152.0).
            2) Проверь статус CI gate у PR #342 (v28.153.0, ветка layout-stage-3) и при полностью зелёном CI слей его squash-коммитом с трейлерами Co-Authored-By и Claude-Session.
            3) Если v28.153.0 уже слит и собрал 33 файла — выполни следующий шаг по порядку (Этап 4 перекладки папок infrastructure/ <- deploy, terraform с сохранением переходника deploy/install-vps.sh и сверка разделов INFRA, DOC, QA).
            Строго соблюдай запрет на голый pass (scripts/check-runtime-placeholders.py) и не сливай ничего в main, пока идёт сборка выпуска.
            В конце запиши отчёт на русском в /tmp/corgi-reports/report_${i}.md."
          done

      - name: Upload Reports & Updated Prompts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-autonomous-reports-${{ github.run_number }}
          path: /tmp/corgi-reports/
