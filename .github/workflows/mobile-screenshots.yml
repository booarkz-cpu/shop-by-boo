name: Mobile screenshots

# Screenshots of the customer apps for README and store listings. Debug builds start in
# demo mode (fixed data, no network): Android with --ez corgi_demo true, iOS with -CorgiDemo.
# The pictures are uploaded as the "mobile-screenshots" artifacts of the run.
# Run by hand with «commit» to also refresh the admin panel and cabinet catalog and commit every
# picture (screenshots/mobile, screenshots/admin_panel, screenshots/storefront_user, README) to the branch.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit the screenshots (mobile, admin panel, cabinet) to the branch"
        type: boolean
        default: false
  pull_request:
    paths: ['mobile/android-user/**', 'mobile/ios-user/**', 'mobile/l10n/**', '.github/workflows/mobile-screenshots.yml']

permissions:
  contents: read

concurrency:
  group: mobile-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Build debug application
        working-directory: mobile/android-user
        run: bash gradlew assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Take screenshots on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r mobile/android-user/app/build/outputs/apk/debug/app-debug.apk
            mkdir -p shots
            for tab in vpn subscription premium locations settings support devices family status; do adb shell am force-stop shop.remnawave.user.preview; adb shell am start -W -n shop.remnawave.user.preview/shop.remnawave.user.MainActivity --ez corgi_demo true --es corgi_tab $tab --es corgi_lang ru; sleep 6; adb exec-out screencap -p > shots/android-$tab.png; done
            adb shell am force-stop shop.remnawave.user.preview; adb shell am start -W -n shop.remnawave.user.preview/shop.remnawave.user.MainActivity --ez corgi_demo true --ez corgi_vpn_on true --es corgi_tab vpn --es corgi_lang ru; sleep 6; adb exec-out screencap -p > shots/android-vpn-on.png
            adb shell am force-stop shop.remnawave.user.preview; adb shell am start -W -n shop.remnawave.user.preview/shop.remnawave.user.MainActivity --ez corgi_demo true --es corgi_tab vpn --es corgi_lang en; sleep 6; adb exec-out screencap -p > shots/android-vpn-en.png
      - uses: actions/upload-artifact@v7
        with:
          name: mobile-screenshots-android
          path: shots/*.png
          if-no-files-found: error

  ios:
    name: iOS screenshots
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Build simulator application
        working-directory: mobile/ios-user
        run: xcodebuild -project VpnShopUser.xcodeproj -scheme VpnShopUser -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Take screenshots in the simulator
        run: |
          set -eu
          device=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl status_bar "$device" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          app=$(find mobile/ios-user/build/Build/Products -name 'VpnShopUser.app' -maxdepth 3 | head -1)
          xcrun simctl install "$device" "$app"
          bundle=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          mkdir -p shots
          for tab in vpn subscription premium locations settings support devices family status; do
            xcrun simctl launch --terminate-running-process "$device" "$bundle" -CorgiDemo -CorgiTab "$tab" -shop_lang ru
            sleep 6
            xcrun simctl io "$device" screenshot "shots/ios-$tab.png"
          done
          xcrun simctl launch --terminate-running-process "$device" "$bundle" -CorgiDemo -CorgiVpnOn -CorgiTab vpn -shop_lang ru
          sleep 6
          xcrun simctl io "$device" screenshot "shots/ios-vpn-on.png"
      - uses: actions/upload-artifact@v7
        with:
          name: mobile-screenshots-ios
          path: shots/*.png
          if-no-files-found: error

  admin:
    name: Admin panel and cabinet catalog
    if: github.event_name == 'workflow_dispatch' && inputs.commit
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: shots
          POSTGRES_PASSWORD: shots-password
          POSTGRES_DB: shots
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shots -d shots"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            admin/package-lock.json
            cabinet/package-lock.json
      - name: Install and build
        run: |
          python -m pip install -r backend/requirements.txt -r backend/requirements-test.txt
          cd admin
          npm ci
          npm ci --prefix ../cabinet
          npx playwright install --with-deps chromium
          npm run build
          NEXT_BASE_PATH=/cabinet npm run build --prefix ../cabinet
      - name: Capture every admin and cabinet section
        env:
          APP_ENV: test
          APP_SECRET: browser-test-only-secret-at-least-32-characters
          COOKIE_SECURE: "false"
          COOKIE_SAMESITE: lax
          MOBILE_REQUIRE_PROOF: "false"
          PAYMENTS_SANDBOX: "true"
          CUSTOMER_WEBAUTHN_ORIGIN: http://localhost:8777
          WEBAUTHN_ORIGIN: http://localhost:8777
          BROWSER_DATABASE_URL: postgresql+asyncpg://shots:shots-password@127.0.0.1:5432/shots
          BROWSER_REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          python tests/passkey_browser_server.py > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:8777/ && break; sleep 2; done
          node admin/scripts/screenshots-catalog.mjs "$PWD"
          python3 scripts/screenshots/readme_admin.py
      - uses: actions/upload-artifact@v7
        with:
          name: admin-screenshots
          path: |
            screenshots/admin_panel/
            screenshots/storefront_user/
            README.md
          if-no-files-found: error

  commit:
    name: Commit screenshots to the branch
    if: github.event_name == 'workflow_dispatch' && inputs.commit
    needs: [android, ios, admin]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/shots
      - name: Put the pictures in place and push
        run: |
          set -eu
          shots="$RUNNER_TEMP/shots"
          mkdir -p screenshots/mobile
          cp "$shots"/mobile-screenshots-android/*.png "$shots"/mobile-screenshots-ios/*.png screenshots/mobile/
          rm -rf screenshots/admin_panel screenshots/storefront_user
          cp -r "$shots"/admin-screenshots/screenshots/admin_panel "$shots"/admin-screenshots/screenshots/storefront_user screenshots/
          cp "$shots"/admin-screenshots/README.md README.md
          python3 scripts/generate-project-map.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots README.md docs/PROJECT_FILE_MAP.md
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Скриншоты: приложения Android/iOS, админ-панель и кабинет (workflow Mobile screenshots)"
          git push origin "HEAD:${{ github.ref_name }}"
