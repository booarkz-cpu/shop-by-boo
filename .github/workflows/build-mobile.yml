name: Build mobile apps for a release

# Builds the customer and administrator apps and attaches them to the GitHub Release, without a local build:
#   Android: APK and AAB (signed with ANDROID_* secrets, otherwise unsigned for signing later);
#   iOS: unsigned IPA and a simulator build (signed IPA too when IOS_* secrets are set).
# Runs after «Publish GitHub release» on main (releases are published with GITHUB_TOKEN, which raises no
# «release» event), or by hand for any existing release tag. Pull requests only build (Mobile packages).
on:
  workflow_run:
    workflows: ["Publish GitHub release"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the apps to (e.g. v28.54.0); empty = latest release"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: build-mobile-${{ inputs.tag || github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Find the release
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      ref: ${{ steps.tag.outputs.ref }}
      skip: ${{ steps.tag.outputs.skip }}
    steps:
      - id: tag
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          TAG: ${{ inputs.tag }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const release = process.env.TAG
              ? (await github.rest.repos.getReleaseByTag({owner, repo, tag: process.env.TAG})).data
              : (await github.rest.repos.getLatestRelease({owner, repo})).data;
            if (!process.env.TAG) {
              // Automatic run: only a release that this publishing run created. A run that published nothing new
              // (same version) must not rebuild and replace the packages of an older release.
              const started = new Date(context.payload.workflow_run.run_started_at || context.payload.workflow_run.created_at);
              if (new Date(release.published_at) < started) {
                core.notice(`No new release published by this run (latest is ${release.tag_name}); nothing to build.`);
                core.setOutput('skip', 'true');
                return;
              }
            }
            if (!/^v\d+\.\d+\.\d+$/.test(release.tag_name)) throw new Error(`Unexpected tag ${release.tag_name}`);
            core.setOutput('tag', release.tag_name);
            core.setOutput('ref', `refs/tags/${release.tag_name}`);
            core.notice(`Apps for ${release.tag_name}`);

  android:
    name: Android APK + AAB
    needs: release
    if: needs.release.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.release.outputs.ref }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache: false
      - id: xray
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: mobile/android-user/app/libs/libv2ray.aar
          key: xray-aar-${{ hashFiles('scripts/mobile/build-xray-aar.sh') }}
      - name: Build the embedded VPN engine (libv2ray.aar)
        if: steps.xray.outputs.cache-hit != 'true'
        run: bash scripts/mobile/build-xray-aar.sh
      - name: Build APK and AAB
        env:
          CORGI_SHOP_URL: ${{ vars.CORGI_SHOP_URL }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          mkdir -p dist/mobile
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            export ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
            trap 'rm -f "$ANDROID_KEYSTORE"' EXIT
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE"
            export ANDROID_BUILD_MODE=release
          else
            export ANDROID_BUILD_MODE=verify-release
            echo "::notice title=Android::No ANDROID_KEYSTORE_BASE64 secret: APK/AAB are unsigned"
          fi
          bash scripts/build-android-apk.sh "$PWD/dist/mobile"
          ls -l dist/mobile
          ls dist/mobile/*.apk dist/mobile/*.aab >/dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-android
          path: dist/mobile/
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS IPA
    needs: release
    if: needs.release.outputs.skip != 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.release.outputs.ref }}
      - name: Unsigned IPA and simulator build
        env:
          CORGI_SHOP_URL: ${{ vars.CORGI_SHOP_URL }}
        run: bash scripts/build-ios-packages.sh "$PWD/dist/mobile"
      - name: Signed IPA when the Apple identity is configured
        env:
          CORGI_SHOP_URL: ${{ vars.CORGI_SHOP_URL }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_USER_PROFILE_BASE64: ${{ secrets.IOS_USER_PROFILE_BASE64 }}
          IOS_ADMIN_PROFILE_BASE64: ${{ secrets.IOS_ADMIN_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_USER_PUSH_PROFILE_BASE64: ${{ secrets.IOS_USER_PUSH_PROFILE_BASE64 }}
          IOS_USER_TUNNEL_PROFILE_BASE64: ${{ secrets.IOS_USER_TUNNEL_PROFILE_BASE64 }}
          IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'release-testing' }}
        run: |
          set -Eeuo pipefail
          if [[ -n "$IOS_CERTIFICATE_BASE64" ]]; then bash scripts/build-ios-signed.sh "$PWD/dist/mobile"
          else echo "::notice title=iOS::No IOS_CERTIFICATE_BASE64 secret: only the unsigned IPA is attached"; fi
          ls -l dist/mobile
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-ios
          path: dist/mobile/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attach to the GitHub Release
    needs: [release, android, ios]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/apps
          merge-multiple: true
      - name: Upload the packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/apps"
          # v28.120.0: the update manifests of the Android apps go with the APKs they describe. This job replaces
          # the stable APKs, so a manifest left from another build would carry the wrong SHA-256.
          files=$(ls *.apk *.aab *.ipa *.zip *.sha256 corgi-lusi-android.json corgi-lusi-android-admin.json 2>/dev/null)
          test -n "$files"
          # --clobber: a re-run replaces the packages of the same release instead of failing.
          gh release upload "$TAG" $files --clobber --repo "$GITHUB_REPOSITORY"
          {
            echo "### Мобильные приложения прикреплены к $TAG"
            for f in $files; do echo "- $f"; done
            echo
            echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
