name: Corgi Lusi CI
# CI trigger: verify main after frontend/backend fixes

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend • Python + tests + migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: vpnshop
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: vpnshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vpnshop -d vpnshop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_SECRET: ci-only-secret
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://vpnshop:ci-password@127.0.0.1:5432/vpnshop
      DB_USER: vpnshop
      DB_PASSWORD: ci-password
      DB_NAME: vpnshop
      REDIS_URL: redis://127.0.0.1:6379/0
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-admin-password
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      PAYMENTS_SANDBOX: "true"
      MOBILE_REQUIRE_PROOF: "false"
      AUTO_RENEW_ENABLED: "false"
      AUDIT_TEST_DATABASE_URL: postgresql+asyncpg://vpnshop:ci-password@127.0.0.1:5432/vpnshop
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
      - name: Compile Python
        working-directory: backend
        run: python -m compileall -q app worker.py
      - name: Current release documentation contract
        run: |
          python scripts/check-current-docs.py
          python scripts/check-runtime-placeholders.py
          python scripts/generate-project-map.py --check
      - name: Setup Node for release publisher checks
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Release publisher invariants
        run: node --test tests/release-publisher.test.cjs
      - name: Terminal screen model
        run: node --experimental-strip-types --test tests/terminal-screen.test.mjs
      - name: Alembic heads
        working-directory: backend
        run: alembic heads
      - name: Alembic upgrade
        working-directory: backend
        run: alembic upgrade head
      - name: Tests
        # A hung test fails after 5 minutes with all thread stacks instead of blocking the job.
        timeout-minutes: 30
        run: |
          # -v prints each test id before it runs, so a timeout dump names the hung test.
          # Output goes to a file, not a pipe: a stray child process that keeps the pipe
          # open can no longer stall the step after pytest has finished.
          status=0
          python -m pytest -v tests --disable-warnings --maxfail=1 --timeout=300 --timeout-method=thread > "$RUNNER_TEMP/pytest.log" 2>&1 < /dev/null || status=$?
          grep -vE ' PASSED +\[' "$RUNNER_TEMP/pytest.log" | tail -n 400
          grep -cE ' PASSED +\[' "$RUNNER_TEMP/pytest.log" | sed 's/^/passed tests: /'
          exit $status
      - name: Report failing tests
        if: failure()
        run: |
          {
            echo "Last test started: $(grep -E '^tests/.*::' "$RUNNER_TEMP/pytest.log" | tail -n 1)"
            grep -E '^(FAILED|ERROR) |Timeout|^E  ' "$RUNNER_TEMP/pytest.log" | head -n 30
            echo "--- tail ---"
            grep -v '^$' "$RUNNER_TEMP/pytest.log" | grep -v 'site-packages' | tail -n 40
          } | sed 's/%/%25/g' > "$RUNNER_TEMP/tail.txt" || true
          echo "::error title=pytest failure summary::$(sed ':a;N;$!ba;s/\n/%0A/g' "$RUNNER_TEMP/tail.txt")"

  passkey-browser:
    name: Content, customer operations and passkeys • Chromium end-to-end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install runtime and browser
        run: |
          python -m pip install -r backend/requirements.txt -r backend/requirements-test.txt
          cd admin
          npm ci
          npm ci --prefix ../cabinet
          npx playwright install --with-deps chromium
      - name: Build and exercise public content, customer operations and WebAuthn
        working-directory: admin
        run: |
          npm run typecheck
          npm run build
          NEXT_BASE_PATH=/cabinet npm run build --prefix ../cabinet
          npm run test:e2e

  support:
    name: Support Pro • runtime tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: support
          POSTGRES_PASSWORD: ci-support-password
          POSTGRES_DB: support
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U support -d support"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AUDIT_TEST_SUPPORT_DATABASE_URL: postgresql+asyncpg://support:ci-support-password@127.0.0.1:5432/support
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install and test
        working-directory: support-pro
        run: |
          python -m pip install -r requirements-dev.txt
          PYTHONPATH=. python -m pytest -q tests

  security:
    name: Dependency vulnerability audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Python dependencies
        run: |
          python -m pip install pip-audit
          for file in backend/requirements.txt support-pro/app/requirements.txt support-pro/requirements.txt support-pro/requirements-dev.txt; do
            pip-audit -r "$file"
          done
      - name: JavaScript dependencies
        run: |
          for dir in admin miniapp cabinet; do
            (cd "$dir" && npm audit --audit-level=high)
          done

  frontend:
    name: ${{ matrix.app }} • typecheck + build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        app: [admin, miniapp, cabinet]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Install
        run: npm ci
      - name: Install shared cabinet dependencies
        if: matrix.app == 'miniapp'
        run: npm ci --prefix ../cabinet
      - name: Typecheck
        run: npm run typecheck
      - name: Customer workspace interactions
        if: matrix.app == 'cabinet'
        run: npm test
      - name: Build
        run: npm run build

  compose:
    name: Docker Compose • configuration
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate compose
        run: |
          cp .env.example .env
          cp support-pro/.env.example support-pro/.env
          docker compose -f docker-compose.yml config --quiet
          # Every PostgreSQL image reference is pinned to the digest of its tag.
          want="$(docker buildx imagetools inspect postgres:18.6-alpine --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "::notice title=postgres:18.6-alpine digest::$want"
          refs="$(grep -rhoE 'postgres:[0-9][^ "}]*' docker-compose.yml docker-compose.test.yml support-pro/docker-compose.yml | sort -u)"
          echo "$refs"
          test "$refs" = "postgres:18.6-alpine@$want"
          cp .env.test.example .env.test
          docker compose --env-file .env.test -f docker-compose.test.yml config --quiet

  containers:
    name: Containers • non-root startup and Redis authentication
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Prepare isolated test configuration
        run: |
          cp .env.example .env
          cp support-pro/.env.example support-pro/.env
          python3 scripts/harden-env.py
          python3 - <<'PY'
          from pathlib import Path
          import secrets
          p=Path('.env')
          p.write_text(p.read_text()+'\nAPP_ENV=test\nAPI_DOMAIN=api.example.test\nADMIN_DOMAIN=admin.example.test\nAPP_DOMAIN=app.example.test\nCABINET_DOMAIN=cabinet.example.test\nAPP_SECRET='+secrets.token_hex(32)+'\n')
          p=Path('support-pro/.env')
          p.write_text(p.read_text()+'\nSESSION_SECRET='+secrets.token_hex(32)+'\nBOT_TOKEN=123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi\n')
          PY
      - name: Move PostgreSQL 16 data to PostgreSQL 18
        run: |
          project="$(docker compose config --format json | jq -r .name)"
          old=postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
          seed(){ # volume user db
            docker volume create "${project}_$1" >/dev/null
            docker run -d --name "seed-$1" -e POSTGRES_USER="$2" -e POSTGRES_PASSWORD=seed -e POSTGRES_DB="$3" -v "${project}_$1":/var/lib/postgresql/data "$old" >/dev/null
            for i in $(seq 1 60); do docker exec "seed-$1" pg_isready -U "$2" -d "$3" >/dev/null 2>&1 && break; sleep 2; done
            sleep 3
            docker exec "seed-$1" psql -U "$2" -d "$3" -v ON_ERROR_STOP=1 -c "CREATE TABLE legacy_orders(id serial PRIMARY KEY, note text, paid numeric(12,2)); INSERT INTO legacy_orders(note, paid) SELECT 'order '||g, g FROM generate_series(1,1500) g; CREATE TABLE legacy_users(id int PRIMARY KEY); INSERT INTO legacy_users SELECT generate_series(1,42);"
            docker rm -f "seed-$1" >/dev/null
          }
          seed postgres_data vpnshop vpnshop
          seed support_postgres_data support support
          APP_DIR="$PWD" ROLLBACK_DIR="$RUNNER_TEMP/rollback" bash scripts/upgrade-postgres.sh | tee "$RUNNER_TEMP/upgrade.log"
          grep -q 'db: moved to PostgreSQL 18' "$RUNNER_TEMP/upgrade.log"
          grep -q 'support_db: moved to PostgreSQL 18' "$RUNNER_TEMP/upgrade.log"
          docker compose up -d --wait db support_db
          test "$(docker compose exec -T db psql -U vpnshop -d vpnshop -At -c 'SELECT count(*), sum(paid) FROM legacy_orders')" = "1500|1125750.00"
          test "$(docker compose exec -T support_db psql -U support -d support -At -c 'SELECT count(*) FROM legacy_users')" = "42"
          docker compose exec -T db psql -U vpnshop -d vpnshop -At -c 'SHOW server_version' | grep -E '^18\.'
          # A second run is a no-op and the PostgreSQL 16 volume is kept for rollback.
          APP_DIR="$PWD" ROLLBACK_DIR="$RUNNER_TEMP/rollback" bash scripts/upgrade-postgres.sh | grep -q 'db: already moved to PostgreSQL 18'
          docker volume inspect "${project}_postgres_data" >/dev/null
          ls "$RUNNER_TEMP/rollback"/postgres16-db-*.dump
          # The synthetic tables are not part of either schema: Support Pro refuses unknown unversioned schemas.
          docker compose exec -T db psql -U vpnshop -d vpnshop -c 'DROP TABLE legacy_orders, legacy_users'
          docker compose exec -T support_db psql -U support -d support -c 'DROP TABLE legacy_orders, legacy_users'
      - name: Build and start services
        run: |
          # Job logs are not always downloadable: on a failed build surface its tail as an annotation.
          if ! docker compose --progress plain build backend admin miniapp cabinet support_pro support_worker caddy > "$RUNNER_TEMP/build.log" 2>&1; then
            tail -n 300 "$RUNNER_TEMP/build.log"
            echo "::error title=docker compose build::$(grep -E 'ERROR|error|failed|npm ERR|Cannot|No matching|conflict' "$RUNNER_TEMP/build.log" | tail -n 25 | tr '\n' ' ' | cut -c1-3500)"
            exit 1
          fi
          docker compose up -d --wait --wait-timeout 240 backend admin miniapp cabinet support_pro support_worker
          # PostgreSQL 18 everywhere, and pg_dump in the backend image matches the server major version.
          docker compose exec -T db postgres --version | grep -E 'PostgreSQL\) 18\.'
          docker compose exec -T support_db postgres --version | grep -E 'PostgreSQL\) 18\.'
          docker compose exec -T backend pg_dump --version | grep -E 'PostgreSQL\) 18\.'
      - name: Verify privilege and authentication boundaries
        run: |
          for service in backend admin miniapp cabinet support_pro; do
            test "$(docker compose exec -T "$service" id -u)" != 0
          done
          for service in redis support_redis; do
            docker compose exec -T "$service" redis-cli ping | grep -q NOAUTH
            docker compose exec -T "$service" sh -c 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping' | grep -qx PONG
            docker compose exec -T "$service" sh -c 'test "$(awk '\''/^Uid:/ {print $2}'\'' /proc/1/status)" != 0'
          done
          docker compose exec -T backend python -c "from pathlib import Path; p=Path('/data/app-packages/.write-test'); p.write_text('ok'); p.unlink()"
          docker compose run --rm --no-deps --entrypoint caddy caddy validate --config /etc/caddy/Caddyfile
          test "$(docker compose run --rm --no-deps --entrypoint id caddy -u)" = 10001
      - name: Logs on failure
        if: failure()
        run: |
          docker compose logs --tail=100
          # Job logs are not always downloadable: surface the state as annotations too.
          docker compose ps -a --format '{{.Service}} {{.State}} {{.Status}}' | while read -r line; do echo "::warning title=service::$line"; done
          for svc in $(docker compose ps -a --format '{{.Service}} {{.State}} {{.Health}}' | awk '$2!="running" || $3=="unhealthy" {print $1}'); do
            echo "::error title=$svc logs::$(docker compose logs --tail=25 --no-log-prefix "$svc" 2>&1 | tr '\n' ' ' | cut -c1-3500)"
          done
      - name: Stop isolated services
        if: always()
        run: docker compose down -v

  android:
    name: Android • ${{ matrix.app }} PKCE build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        app: [android-user, android-admin]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Compile debug application
        working-directory: mobile/${{ matrix.app }}
        run: bash gradlew assembleDebug --no-daemon

  ios:
    name: iOS • ${{ matrix.app }} PKCE build
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - app: ios-user
            project: VpnShopUser
          - app: ios-admin
            project: VpnShopAdmin
    steps:
      - uses: actions/checkout@v5
      - name: Compile simulator application
        working-directory: mobile/${{ matrix.app }}
        run: xcodebuild -project ${{ matrix.project }}.xcodeproj -scheme ${{ matrix.project }} -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
