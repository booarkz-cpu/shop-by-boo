name: Corgi Lusi CI
# CI trigger: verify main after frontend/backend fixes

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# A run cancels only an earlier run of the SAME commit. Keying the group on the ref alone made a
# re-run of an old commit cancel the check of a newer one, and the release gate then found no
# successful CI on the release commit. Retries of one commit still supersede each other.
concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  python315-native-arm64:
    name: Python 3.15 native ARM64 dependency smoke
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install and import on native ARM64
        run: |
          test "$(uname -m)" = aarch64
          for service in backend support-pro; do
            extra=requirements-test.txt
            if [ "$service" = support-pro ]; then extra=requirements-dev.txt; fi
            python -m venv "$RUNNER_TEMP/$service"
            py="$RUNNER_TEMP/$service/bin/python"
            "$py" -m pip install --upgrade pip
            "$py" -m pip install --only-binary=:all: -r "services/$service/requirements.txt" -r "services/$service/$extra"
            "$py" -m pip check
            "$py" -c 'import asyncpg, cryptography, PIL, yaml, uvloop, httptools, pydantic_core; assert yaml.safe_load("ok: true") == {"ok": True}'
            if [ "$service" = backend ]; then "$py" -c 'import reportlab, maxminddb'; fi
          done

  python315-wheels:
    name: Python 3.15 wheel availability (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Audit binary dependency resolution
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          python -m pip install --upgrade pip
          failed=0
          for service in backend support-pro; do
            extra=requirements-test.txt
            if [ "$service" = support-pro ]; then extra=requirements-dev.txt; fi
            if python -m pip download --only-binary=:all: --python-version 3.15 --implementation cp --abi cp315 --platform "manylinux_2_17_$TARGET_ARCH" --platform "manylinux2014_$TARGET_ARCH" --platform "manylinux_2_28_$TARGET_ARCH" --platform "manylinux_2_34_$TARGET_ARCH" --dest "$RUNNER_TEMP/wheels/$service" -r "services/$service/requirements.txt" -r "services/$service/$extra"; then
              echo "$service: binary resolution succeeded for $TARGET_ARCH" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::$service binary resolution failed for $TARGET_ARCH; wheel acceptance remains unverified"
              echo "$service: binary resolution FAILED for $TARGET_ARCH" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          done
          # Diagnostic until all upstream wheels are available; do not claim acceptance.
          if [ "$failed" = 1 ]; then echo "Wheel acceptance is NOT confirmed." >> "$GITHUB_STEP_SUMMARY"; fi

  backend:
    # v28.75.0: the suite runs in two halves on separate runners (each with its own PostgreSQL and Redis): one
    # runner took 25–30 minutes and a slow one hit the step limit.
    name: Backend • Python ${{ matrix.python }} + tests + migrations (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.15"]
        shard: [1, 2]
    services:
      postgres:
        image: postgres:19.0-alpine@sha256:cac45fb483caee3668946088a1c0532db89d5285c28dbfeac889b4068296e06f
        env:
          POSTGRES_USER: vpnshop
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: vpnshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vpnshop -d vpnshop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.10-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_SECRET: ci-only-secret
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://vpnshop:ci-password@127.0.0.1:5432/vpnshop
      DB_USER: vpnshop
      DB_PASSWORD: ci-password
      DB_NAME: vpnshop
      REDIS_URL: redis://127.0.0.1:6379/0
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-admin-password
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      PAYMENTS_SANDBOX: "true"
      MOBILE_REQUIRE_PROOF: "false"
      AUTO_RENEW_ENABLED: "false"
      AUDIT_TEST_DATABASE_URL: postgresql+asyncpg://vpnshop:ci-password@127.0.0.1:5432/vpnshop
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "${{ matrix.python }}"
          cache: pip
          cache-dependency-path: services/backend/requirements.txt
      - name: Install dependencies
        working-directory: services/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
      - name: Compile Python
        working-directory: services/backend
        run: python -m compileall -q app worker.py
      - name: Distribution accepted by installed updater (real package)
        if: matrix.shard == 1
        run: python3 tests/test_release_archive_compatibility.py
      - name: Current release documentation contract
        run: |
          python scripts/check-current-docs.py
          python scripts/audit/check_release_changelog.py
          python scripts/check-runtime-placeholders.py
          python scripts/generate-architecture-docs.py --check
          python scripts/generate-project-map.py --check
          python scripts/audit/requirements_register.py --check
          python scripts/audit/source_traceability.py --check
          python scripts/audit/check_release_readiness.py
          python scripts/audit/run_full_audit.py
          python scripts/audit/check_payment_provider_registry.py --check
      - name: Admin modules — which test exercises each changing route (docs/ru/new/ADMIN_VERIFICATION.md)
        env:
          MEDIA_DIR: /tmp/media
          BACKUP_DIR: /tmp/backups
        run: python scripts/verify-admin-matrix.py --check
      - name: Documentation links and anchors
        # A link to a moved or never-created file breaks the first thing a new operator opens.
        # Historical records (docs/archive, .github/release-v*.md) are reported, not enforced.
        run: python scripts/check-doc-links.py
      - name: Setup Node for release publisher checks
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
      - name: Release publisher invariants
        run: node --test tests/release-publisher.test.cjs tests/dependabot-automerge.test.cjs tests/dependabot-queue.test.cjs tests/mobile-client-release.test.cjs
      - name: Terminal screen model
        run: node --experimental-strip-types --test tests/terminal-screen.test.mjs
      - name: Panel survives a wrapped list and an incomplete label
        run: TZ=Europe/Moscow node --experimental-strip-types --test tests/admin-safe.test.mjs
      - name: Node port only for the panel (nftables in network namespaces)
        # v28.90.0 (N5): the installer's FIREWALL script itself; real TCP connections from «panel» and «outsider».
        if: matrix.shard == 1
        timeout-minutes: 5
        run: |
          sudo apt-get install -y -qq nftables iproute2 >/dev/null
          sudo env "PATH=$PATH" bash scripts/ci/node-port-guard.sh
      - name: Server modules of «Установка» (guard, MSS clamp, swap) for real
        # v28.92.0 (N7): services/backend/app/rw_netmods.py scripts in network namespaces and a swap file on the runner.
        if: matrix.shard == 1
        timeout-minutes: 8
        run: |
          sudo apt-get install -y -qq nftables iproute2 iputils-ping >/dev/null
          sudo env "PATH=$PATH" bash scripts/ci/netmods-check.sh
      - name: CrowdSec module of «Установка» for real (install, ban reaches nftables, removal)
        # v28.114.0: the script of services/backend/app/rw_netmods.py on the runner, from the official CrowdSec repository.
        if: matrix.shard == 1
        timeout-minutes: 10
        run: sudo env "PATH=$PATH" bash scripts/ci/crowdsec-check.sh
      - name: MASQUE on a node behind the SelfSteal site, for real (tunnel, hot users, removal)
        # v28.129.0: the script and files of services/backend/app/rw_masque.py on the runner — the node's SelfSteal Caddy, the
        # pinned Xray and HAProxy images and a real Xray client.
        if: matrix.shard == 2
        timeout-minutes: 12
        run: sudo env "PATH=$PATH" bash scripts/ci/masque-check.sh
      - name: No secrets in the repository (.env, private keys, dumps, tokens)
        # v28.143.0 (REQ-INFRA-0021): every file git tracks; the findings name the path and the kind, never the value.
        if: matrix.shard == 1
        timeout-minutes: 2
        run: python3 scripts/ci/secret-leak-check.py
      - name: Ports of a server, for real (iptables and nftables in network namespaces)
        # v28.135.0: the script of services/backend/app/rw_ports.py opens, reapplies after a «reboot» and closes ports; SSH is never closed.
        if: matrix.shard == 2
        timeout-minutes: 5
        run: sudo env "PATH=$PATH" bash scripts/ci/ports-check.sh
      - name: MTProto module on the runner
        # v28.94.0 (N7): rw_netmods.MTPROTO with the pinned mtg image — secret, container, port, «off».
        if: matrix.shard == 1
        timeout-minutes: 6
        run: sudo env "PATH=$PATH" bash scripts/ci/mtproto-check.sh
      - name: Caddyfiles of the Remnawave wizard
        # v28.97.0 (N7): every variant (incl. a former panel domain after «Сменить домен панели») validated by the pinned Caddy.
        if: matrix.shard == 1
        timeout-minutes: 5
        run: bash scripts/ci/wizard-caddy-check.sh
      - name: psiphond on the runner
        # v28.99.0 (N7): rw_netmods.PSIPHON builds psiphond from the pinned commit, runs it; Psiphon's ConsoleClient fetches a page through it.
        if: matrix.shard == 2
        timeout-minutes: 25
        run: sudo env "PATH=$PATH" bash scripts/ci/psiphon-check.sh
      - name: Russian geo lists for the nodes
        # v28.95.0 (N7): the latest lists by the SHA-256 GitHub published, rw_steps.GEO, and Xray of the node image loading them.
        if: matrix.shard == 1
        timeout-minutes: 8
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: sudo env "PATH=$PATH" GH_API_TOKEN="$GH_API_TOKEN" bash scripts/ci/geo-check.sh
      - name: Alembic heads
        working-directory: services/backend
        run: alembic heads
      - name: Alembic upgrade
        working-directory: services/backend
        run: alembic upgrade head
      - name: Tests
        # A hung test fails after 5 minutes with all thread stacks instead of blocking the job.
        timeout-minutes: 30
        run: |
          # -v prints each test id before it runs, so a timeout dump names the hung test.
          # Output goes to a file, not a pipe: a stray child process that keeps the pipe
          # open can no longer stall the step after pytest has finished.
          status=0
          python scripts/ci/test-shard.py "${{ matrix.shard }}" 2 > "$RUNNER_TEMP/shard.txt"
          echo "test files in this half: $(wc -l < "$RUNNER_TEMP/shard.txt")"
          python -m pytest -v $(cat "$RUNNER_TEMP/shard.txt") --disable-warnings --maxfail=1 --timeout=300 --timeout-method=thread > "$RUNNER_TEMP/pytest.log" 2>&1 < /dev/null || status=$?
          grep -vE ' PASSED +\[' "$RUNNER_TEMP/pytest.log" | tail -n 400
          grep -cE ' PASSED +\[' "$RUNNER_TEMP/pytest.log" | sed 's/^/passed tests: /'
          exit $status
      - name: Report failing tests
        if: failure()
        run: |
          {
            echo "Last test started: $(grep -E '^tests/.*::' "$RUNNER_TEMP/pytest.log" | tail -n 1)"
            grep -E '^(FAILED|ERROR) |Timeout|^E  ' "$RUNNER_TEMP/pytest.log" | head -n 30
            echo "--- tail ---"
            grep -v '^$' "$RUNNER_TEMP/pytest.log" | grep -v 'site-packages' | tail -n 40
          } | sed 's/%/%25/g' > "$RUNNER_TEMP/tail.txt" || true
          echo "::error title=pytest failure summary::$(sed ':a;N;$!ba;s/\n/%0A/g' "$RUNNER_TEMP/tail.txt")"

  lint:
    name: Lint • Python (ruff) and shell syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: ruff (ruff.toml)
        run: |
          pip install ruff==0.17.3
          ruff check services/backend scripts tests --output-format github
      - name: Spelling dictionaries (RU/EN/UK)
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends hunspell hunspell-en-us hunspell-en-gb hunspell-ru hunspell-uk
          python scripts/audit/check_spelling.py --self-test
      - name: At most one active pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const open = await github.paginate(github.rest.pulls.list, {...context.repo, state: 'open', per_page: 100});
            if (open.length > 1) core.setFailed('Owner policy: consolidate changes into one active PR before merging. Open: ' + open.map(pr => '#' + pr.number).join(', '));
            else core.info('Single active PR policy: ' + open.length + ' open.');
      - name: Shell scripts parse
        run: |
          status=0
          while IFS= read -r -d '' file; do bash -n "$file" || { echo "::error file=$file::bash -n failed"; status=1; }; done \
            < <(git ls-files -z '*.sh')
          exit $status

  passkey-browser:
    name: Content, customer operations and passkeys • Chromium end-to-end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          # Cached downloads: the job installs the same backend requirements on every run.
          cache: pip
          cache-dependency-path: |
            services/backend/requirements.txt
            services/backend/requirements-test.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            apps/lucy-admin/web/package-lock.json
            apps/user-cabinet/package-lock.json
      - name: Install runtime and browser
        run: |
          python -m pip install -r services/backend/requirements.txt -r services/backend/requirements-test.txt
          cd apps/lucy-admin/web
          npm ci
          npm ci --prefix ../../user-cabinet
          npx playwright install --with-deps chromium
      - name: Build and exercise public content, customer operations and WebAuthn
        working-directory: apps/lucy-admin/web
        run: |
          npm run typecheck
          npm run build
          NEXT_BASE_PATH=/cabinet npm run build --prefix ../../user-cabinet
          status=0
          npx playwright test --reporter=line > "$RUNNER_TEMP/e2e.log" 2>&1 || status=$?
          tail -n 200 "$RUNNER_TEMP/e2e.log"
          if [ "$status" -ne 0 ]; then
            # The failing specs and their first error lines, readable from the check annotations.
            grep -E '^\s+[0-9]+\) |Error:|Expected|Received|Timeout|locator' "$RUNNER_TEMP/e2e.log" | head -n 40 > "$RUNNER_TEMP/e2e-summary.txt" || true
            echo "::error title=e2e failure summary::$(sed ':a;N;$!ba;s/\n/%0A/g' "$RUNNER_TEMP/e2e-summary.txt")"
            exit "$status"
          fi

  support:
    name: Support Pro • runtime tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:19.0-alpine@sha256:cac45fb483caee3668946088a1c0532db89d5285c28dbfeac889b4068296e06f
        env:
          POSTGRES_USER: support
          POSTGRES_PASSWORD: ci-support-password
          POSTGRES_DB: support
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U support -d support"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AUDIT_TEST_SUPPORT_DATABASE_URL: postgresql+asyncpg://support:ci-support-password@127.0.0.1:5432/support
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Match the Support Pro runtime image: dependency upgrades must pass on Python 3.15 itself.
          python-version: "3.15"
      - name: Install and test
        working-directory: services/support-pro
        run: |
          python -m pip install -r requirements-dev.txt
          PYTHONPATH=. python -m pytest -q tests

  security:
    name: Dependency vulnerability audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
      - name: Python dependencies
        run: |
          python -m pip install pip-audit
          for file in services/backend/requirements.txt services/support-pro/requirements.txt services/support-pro/requirements-dev.txt; do
            pip-audit -r "$file"
          done
      - name: Python static security analysis
        # High-severity, high-confidence findings only (bandit -lll -iii); anything it reports blocks the merge.
        run: |
          python -m pip install bandit
          bandit -q -r services/backend/app services/support-pro/app -lll -iii
      - name: JavaScript dependencies
        run: |
          for dir in apps/lucy-admin/web apps/telegram-mini-app apps/user-cabinet; do
            (cd "$dir" && npm audit --audit-level=high)
          done
      - name: Secret and vulnerability scan of the repository, SBOM
        # Trivy (pinned by digest): a secret committed to the repository or a HIGH/CRITICAL vulnerability in a
        # lockfile blocks the merge. The CycloneDX list of components is kept as the artifact «sbom».
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb fs --quiet --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 /src
          mkdir -p "$RUNNER_TEMP/sbom"
          docker run --rm -v "$PWD:/src" -v "$RUNNER_TEMP/sbom:/out" aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb fs --quiet --format cyclonedx --output /out/sbom.cdx.json /src
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); n=len(d.get('components') or []); print(f'SBOM: {n} components'); assert n > 100" "$RUNNER_TEMP/sbom/sbom.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom/sbom.cdx.json
          retention-days: 90
      - name: Dependency licences
        # A strong copyleft or source-available licence among the shipped dependencies blocks the merge
        # (scripts/ci/check-licenses.py; weak copyleft — LGPL, MPL — is allowed for a library used as is).
        run: |
          python -m venv /tmp/lic
          /tmp/lic/bin/pip install -q pip-licenses -r services/backend/requirements.txt
          /tmp/lic/bin/pip install -q -r services/support-pro/requirements.txt
          /tmp/lic/bin/pip-licenses --format=json > /tmp/py-licences.json
          for app in admin:apps/lucy-admin/web miniapp:apps/telegram-mini-app cabinet:apps/user-cabinet; do
            name="${app%%:*}"; dir="${app#*:}"
            (cd "$dir" && npm ci --omit=dev --ignore-scripts > /dev/null && npx --yes license-checker@25.0.1 --production --json > "/tmp/$name-licences.json")
          done
          python scripts/ci/check-licenses.py /tmp/py-licences.json /tmp/admin-licences.json /tmp/miniapp-licences.json /tmp/cabinet-licences.json

  frontend:
    name: ${{ matrix.app }} • typecheck + build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # v28.153.0 (docs/MONOREPO_LAYOUT.md, stage 3): the job names stay, the folders moved.
        include:
          - {app: admin, dir: apps/lucy-admin/web}
          - {app: miniapp, dir: apps/telegram-mini-app}
          - {app: cabinet, dir: apps/user-cabinet}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - name: Install
        run: npm ci
      - name: Install shared cabinet dependencies
        if: matrix.app == 'miniapp'
        run: npm ci --prefix ../user-cabinet
      - name: Typecheck
        run: npm run typecheck
      - name: Customer workspace interactions
        if: matrix.app == 'cabinet'
        run: npm test
      - name: Build
        run: npm run build

  compose:
    name: Docker Compose • configuration
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate compose
        run: |
          cp .env.example .env
          cp services/support-pro/.env.example support-pro/.env
          docker compose -f docker-compose.yml config --quiet
          # Every PostgreSQL image reference is the same tag pinned to one digest, and that digest still exists in the
          # registry. Docker Hub rebuilds the tag (base image updates, twice on 2026-11-05): a newer digest is reported
          # as a notice to repin (scripts/repin-images.sh), not a failure of every pull request.
          refs="$(grep -rhoE 'postgres:[0-9][^ "}]*' docker-compose.yml docker-compose.test.yml services/support-pro/docker-compose.yml | sort -u)"
          echo "$refs"
          test "$(echo "$refs" | wc -l)" = 1
          echo "$refs" | grep -qE '^postgres:19\.0-alpine@sha256:[0-9a-f]{64}$'
          pinned="${refs#*@}"
          docker buildx imagetools inspect "postgres@$pinned" >/dev/null
          want="$(docker buildx imagetools inspect postgres:19.0-alpine --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if [ "$want" != "$pinned" ]; then echo "::notice title=postgres:19.0-alpine was rebuilt::pinned $pinned, the tag now points to $want — repin"; fi
          cp .env.test.example .env.test
          docker compose --env-file .env.test -f docker-compose.test.yml config --quiet
      - name: Prometheus alert rules
        # v28.75.0: the alert rules are checked and unit-tested with promtool (the image of the infrastructure/monitoring stack).
        run: |
          docker run --rm -v "$PWD/infrastructure/monitoring/prometheus:/rules:ro" --entrypoint promtool prom/prometheus:v3.5.0 check rules /rules/vpnshop-alerts.yml
          docker run --rm -v "$PWD/infrastructure/monitoring/prometheus:/rules:ro" -w /rules --entrypoint promtool prom/prometheus:v3.5.0 test rules vpnshop-alerts.test.yml

  containers:
    name: Containers • non-root startup and Redis authentication
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Prepare isolated test configuration
        run: |
          cp .env.example .env
          cp services/support-pro/.env.example support-pro/.env
          python3 scripts/harden-env.py
          python3 - <<'PY'
          from pathlib import Path
          import secrets
          p=Path('.env')
          p.write_text(p.read_text()+'\nAPP_ENV=test\nAPI_DOMAIN=api.example.test\nADMIN_DOMAIN=admin.example.test\nAPP_DOMAIN=app.example.test\nCABINET_DOMAIN=cabinet.example.test\nAPP_SECRET='+secrets.token_hex(32)+'\n')
          p=Path('support-pro/.env')
          p.write_text(p.read_text()+'\nSESSION_SECRET='+secrets.token_hex(32)+'\nBOT_TOKEN=123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi\n')
          PY
      - name: Move PostgreSQL 16 data to PostgreSQL 18
        run: |
          project="$(docker compose config --format json | jq -r .name)"
          old=postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
          seed(){ # volume user db
            docker volume create "${project}_$1" >/dev/null
            docker run -d --name "seed-$1" -e POSTGRES_USER="$2" -e POSTGRES_PASSWORD=seed -e POSTGRES_DB="$3" -v "${project}_$1":/var/lib/postgresql/data "$old" >/dev/null
            for i in $(seq 1 60); do docker exec "seed-$1" pg_isready -U "$2" -d "$3" >/dev/null 2>&1 && break; sleep 2; done
            sleep 3
            docker exec "seed-$1" psql -U "$2" -d "$3" -v ON_ERROR_STOP=1 -c "CREATE TABLE legacy_orders(id serial PRIMARY KEY, note text, paid numeric(12,2)); INSERT INTO legacy_orders(note, paid) SELECT 'order '||g, g FROM generate_series(1,1500) g; CREATE TABLE legacy_users(id int PRIMARY KEY); INSERT INTO legacy_users SELECT generate_series(1,42);"
            docker rm -f "seed-$1" >/dev/null
          }
          seed postgres_data vpnshop vpnshop
          seed support_postgres_data support support
          APP_DIR="$PWD" ROLLBACK_DIR="$RUNNER_TEMP/rollback" bash scripts/upgrade-postgres.sh | tee "$RUNNER_TEMP/upgrade.log"
          grep -q 'db: moved to PostgreSQL 18' "$RUNNER_TEMP/upgrade.log"
          grep -q 'support_db: moved to PostgreSQL 18' "$RUNNER_TEMP/upgrade.log"
          APP_DIR="$PWD" ROLLBACK_DIR="$RUNNER_TEMP/rollback" bash scripts/upgrade-postgres19.sh | tee "$RUNNER_TEMP/upgrade19.log"
          grep -q 'db: moved to PostgreSQL 19' "$RUNNER_TEMP/upgrade19.log"
          grep -q 'support_db: moved to PostgreSQL 19' "$RUNNER_TEMP/upgrade19.log"
          docker compose up -d --wait db support_db
          test "$(docker compose exec -T db psql -U vpnshop -d vpnshop -At -c 'SELECT count(*), sum(paid) FROM legacy_orders')" = "1500|1125750.00"
          test "$(docker compose exec -T support_db psql -U support -d support -At -c 'SELECT count(*) FROM legacy_users')" = "42"
          docker compose exec -T db psql -U vpnshop -d vpnshop -At -c 'SHOW server_version' | grep -E '^19\.'
          # A second run is a no-op. PostgreSQL 16 and 18 volumes stay for rollback.
          APP_DIR="$PWD" ROLLBACK_DIR="$RUNNER_TEMP/rollback" bash scripts/upgrade-postgres19.sh | grep -q 'db: already moved to PostgreSQL 19'
          # A stale marker must never certify a missing or wrong destination cluster.
          docker volume create "${project}_pg19_invalid_marker" >/dev/null
          docker run --rm --entrypoint sh -v "${project}_pg19_invalid_marker":/new postgres:19.0-alpine@sha256:cac45fb483caee3668946088a1c0532db89d5285c28dbfeac889b4068296e06f -c 'touch /new/.migrated-from-postgres18'
          if APP_DIR="$PWD" PG19_UPGRADE_SPEC=db:postgres18_data:pg19_invalid_marker:vpnshop:vpnshop bash scripts/upgrade-postgres19.sh > "$RUNNER_TEMP/invalid-marker.log" 2>&1; then
            echo "Invalid migration marker unexpectedly accepted" >&2
            exit 1
          fi
          grep -q 'migration marker exists but destination PG_VERSION is not 19' "$RUNNER_TEMP/invalid-marker.log"
          docker volume rm "${project}_pg19_invalid_marker" >/dev/null
          # Simulate limited shared disk space without filling the runner disk.
          mkdir -p "$RUNNER_TEMP/pg19-capacity/bin" "$RUNNER_TEMP/pg19-capacity/backup"
          source_bytes="$(docker run --rm --entrypoint du -v "${project}_postgres18_data":/old:ro postgres:18.7-alpine@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff -sb /old | awk '{print $1}')"
          test "$source_bytes" -gt 0
          printf '#!/bin/sh\n echo "Filesystem 1-blocks Used Available Capacity Mounted"\n echo "test 0 0 %s 0%% /"\n' "$source_bytes" > "$RUNNER_TEMP/pg19-capacity/bin/df"
          chmod +x "$RUNNER_TEMP/pg19-capacity/bin/df"
          if PATH="$RUNNER_TEMP/pg19-capacity/bin:$PATH" TMPDIR="$RUNNER_TEMP/pg19-capacity" APP_DIR="$PWD" ROLLBACK_DIR="$RUNNER_TEMP/pg19-capacity/backup" PG19_UPGRADE_SPEC=db:postgres18_data:pg19_capacity_test:vpnshop:vpnshop bash scripts/upgrade-postgres19.sh > "$RUNNER_TEMP/capacity.log" 2>&1; then
            echo "Insufficient shared capacity unexpectedly accepted" >&2
            exit 1
          fi
          grep -q 'insufficient shared filesystem capacity' "$RUNNER_TEMP/capacity.log"
          docker compose exec -T db pg_isready -U vpnshop -d vpnshop
          if docker volume inspect "${project}_pg19_capacity_test" >/dev/null 2>&1; then
            echo "Destination created despite failed preflight" >&2
            exit 1
          fi
          docker volume inspect "${project}_postgres_data" >/dev/null
          docker volume inspect "${project}_postgres18_data" >/dev/null
          ls "$RUNNER_TEMP/rollback"/postgres16-db-*.dump
          ls "$RUNNER_TEMP/rollback"/postgres18-db-*.dump
          # The PostgreSQL 18 volume still answers with the copied rows. Nothing deleted it.
          docker run -d --name pg18-rollback --network none -v "${project}_postgres18_data":/var/lib/postgresql postgres:18.7-alpine@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff >/dev/null
          for i in $(seq 1 60); do docker exec pg18-rollback pg_isready -U vpnshop -d vpnshop >/dev/null 2>&1 && break; sleep 2; done
          test "$(docker exec pg18-rollback psql -U vpnshop -d vpnshop -At -c 'SELECT count(*) FROM legacy_orders')" = "1500"
          docker rm -f pg18-rollback >/dev/null
          # Restore the retained dump into an independent disposable PostgreSQL 19 cluster.
          docker run -d --name pg19-backup-verify --network none -e POSTGRES_USER=vpnshop -e POSTGRES_PASSWORD=ci-only -e POSTGRES_DB=vpnshop postgres:19.0-alpine@sha256:cac45fb483caee3668946088a1c0532db89d5285c28dbfeac889b4068296e06f >/dev/null
          trap 'docker rm -fv pg19-backup-verify >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 60); do docker exec pg19-backup-verify pg_isready -h 127.0.0.1 -U vpnshop -d vpnshop >/dev/null 2>&1 && break; sleep 2; done
          backups=("$RUNNER_TEMP/rollback"/postgres18-db-*.dump)
          test "${#backups[@]}" = 1
          docker exec -i pg19-backup-verify pg_restore -U vpnshop -d vpnshop --no-owner --single-transaction --exit-on-error < "${backups[0]}"
          test "$(docker exec pg19-backup-verify psql -U vpnshop -d vpnshop -At -c 'SELECT count(*), sum(paid) FROM legacy_orders')" = "1500|1125750.00"
          test "$(docker exec pg19-backup-verify psql -U vpnshop -d vpnshop -At -c 'SELECT count(*) FROM legacy_users')" = "42"
          docker rm -fv pg19-backup-verify >/dev/null
          trap - EXIT
          # The synthetic tables are not part of either schema: Support Pro refuses unknown unversioned schemas.
          docker compose exec -T db psql -U vpnshop -d vpnshop -c 'DROP TABLE legacy_orders, legacy_users'
          docker compose exec -T support_db psql -U support -d support -c 'DROP TABLE legacy_orders, legacy_users'
      - name: Build and start services
        run: |
          # Job logs are not always downloadable: on a failed build surface its tail as an annotation.
          if ! docker compose --progress plain build backend admin miniapp cabinet support_pro support_worker caddy > "$RUNNER_TEMP/build.log" 2>&1; then
            tail -n 300 "$RUNNER_TEMP/build.log"
            echo "::error title=docker compose build::$(grep -E 'ERROR|error|failed|npm ERR|Cannot|No matching|conflict' "$RUNNER_TEMP/build.log" | tail -n 25 | tr '\n' ' ' | cut -c1-3500)"
            exit 1
          fi
          docker compose up -d --wait --wait-timeout 240 backend admin miniapp cabinet support_pro support_worker
          # PostgreSQL 19 everywhere, and pg_dump in the backend image matches the server major version.
          docker compose exec -T db postgres --version | grep -E 'PostgreSQL\) 19\.'
          docker compose exec -T support_db postgres --version | grep -E 'PostgreSQL\) 19\.'
          docker compose exec -T backend pg_dump --version | grep -E 'PostgreSQL\) 19\.'
      - name: Verify privilege and authentication boundaries
        run: |
          for service in backend admin miniapp cabinet support_pro; do
            test "$(docker compose exec -T "$service" id -u)" != 0
          done
          for service in redis support_redis; do
            docker compose exec -T "$service" redis-cli ping | grep -q NOAUTH
            docker compose exec -T "$service" sh -c 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping' | grep -qx PONG
            docker compose exec -T "$service" sh -c 'test "$(awk '\''/^Uid:/ {print $2}'\'' /proc/1/status)" != 0'
          done
          docker compose exec -T backend python -c "from pathlib import Path; p=Path('/data/app-packages/.write-test'); p.write_text('ok'); p.unlink()"
          docker compose run --rm --no-deps --entrypoint caddy caddy validate --config /etc/caddy/Caddyfile
          test "$(docker compose run --rm --no-deps --entrypoint id caddy -u)" = 10001
      - name: Container scan (the images the shop builds)
        # A HIGH or CRITICAL vulnerability that already has a fix blocks the merge: update the base image digest,
        # the package or the dependency. Trivy is pinned by digest. Exceptions: .trivyignore, each with a reason
        # and an expiry date.
        run: |
          images="$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -E '^shop-by-boo-' | sort -u)"
          test -n "$images"
          for image in $images; do
            echo "== $image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/.trivyignore:/.trivyignore:ro" aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
              image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /.trivyignore --exit-code 1 "$image"
          done
      - name: Restore drill (copy, total loss, restore, same data)
        # Stage 19, C2: scripts/backup.sh → every volume and .env lost → the copy alone brings back every table,
        # the customer's subscription and payment, the administrator's sign-in and the files.
        timeout-minutes: 15
        run: bash scripts/ci/restore-drill.sh
      - name: Logs on failure
        if: failure()
        run: |
          docker compose logs --tail=100
          # Job logs are not always downloadable: surface the state as annotations too.
          docker compose ps -a --format '{{.Service}} {{.State}} {{.Status}}' | while read -r line; do echo "::warning title=service::$line"; done
          for svc in $(docker compose ps -a --format '{{.Service}} {{.State}} {{.Health}}' | awk '$2!="running" || $3=="unhealthy" {print $1}'); do
            echo "::error title=$svc logs::$(docker compose logs --tail=25 --no-log-prefix "$svc" 2>&1 | tr '\n' ' ' | cut -c1-3500)"
          done
      - name: Stop isolated services
        if: always()
        run: docker compose down -v

  android:
    name: Android • ${{ matrix.app }} PKCE build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # v28.151.0 (docs/MONOREPO_LAYOUT.md, stage 2a): the job names stay, the folders moved.
        include:
          - {app: android-user, dir: apps/vpn-shop/android}
          - {app: android-admin, dir: apps/lucy-admin/android}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: "platform-tools platforms;android-35 platforms;android-37.1 build-tools;35.0.0"
      - name: Gradle distribution (retries on GitHub 504)
        run: bash scripts/ci/gradle-warm.sh ${{ matrix.dir }}
      - name: Compile debug application and run JVM unit tests
        run: bash scripts/ci/gradle-warm.sh --exec ${{ matrix.dir }} -- assembleDebug testDebugUnitTest --no-daemon

  android-engine:
    # The customer app with the embedded VPN engine (Xray-core via libv2ray.aar, built from the
    # pinned AndroidLibXrayLite commit and cached by it).
    name: Android • embedded VPN engine
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: "platform-tools platforms;android-35 platforms;android-37.1 build-tools;35.0.0"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - id: xray
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/vpn-shop/android/app/libs/libv2ray.aar
          key: xray-aar-${{ hashFiles('scripts/mobile/build-xray-aar.sh', 'scripts/mobile/xray-artifact.py') }}
      - name: Build libv2ray.aar
        if: steps.xray.outputs.cache-hit != 'true'
        run: bash scripts/mobile/build-xray-aar.sh
      - name: Cache the Gradle distribution only
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle-warm-dists
          key: gradle-dists-${{ hashFiles('apps/vpn-shop/android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Resolve the debug runtime from a clean Gradle home
        run: |
          gradle_dir="$(mktemp -d "$RUNNER_TEMP/gradle-engine.XXXXXX")"
          mkdir -p "$HOME/.gradle-warm-dists" "$gradle_dir"
          if [[ -d "$HOME/.gradle/caches" ]]; then
            mkdir -p "$gradle_dir/caches"
            cp -a "$HOME/.gradle/caches/." "$gradle_dir/caches/"
          fi
          printf 'GRADLE_USER_HOME=%s\n' "$gradle_dir" >> "$GITHUB_ENV"
          printf 'GRADLE_WARM_WRAPPER_CACHE=%s\n' "$HOME/.gradle-warm-dists" >> "$GITHUB_ENV"
          GRADLE_USER_HOME="$gradle_dir" GRADLE_WARM_WRAPPER_CACHE="$HOME/.gradle-warm-dists" \
            bash scripts/ci/gradle-warm.sh --android-runtime apps/vpn-shop/android
          if [[ -d "$gradle_dir/caches" ]]; then
            mkdir -p "$HOME/.gradle/caches"
            cp -a "$gradle_dir/caches/." "$HOME/.gradle/caches/"
          fi
      - name: Compile the app with the engine
        run: |
          bash scripts/ci/gradle-warm.sh --exec apps/vpn-shop/android -- assembleDebug --no-daemon
          # Compare the packaged libgojni.so for each ABI against the AAR.
          bash scripts/mobile/build-xray-aar.sh --verify-apk apps/vpn-shop/android/app/build/outputs/apk/debug/app-debug.apk

  android-ui:
    # Compose UI tests of both apps on an emulator, in the demo mode of the debug builds.
    name: Android • UI tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: "platform-tools platforms;android-35 platforms;android-37.1 build-tools;35.0.0"
      - name: Gradle distribution (retries on GitHub 504)
        run: bash scripts/ci/gradle-warm.sh apps/vpn-shop/android apps/lucy-admin/android
      - name: Build the apps and their tests
        run: |
          bash scripts/ci/gradle-warm.sh --exec apps/vpn-shop/android -- assembleDebug assembleDebugAndroidTest --no-daemon
          bash scripts/ci/gradle-warm.sh --exec apps/lucy-admin/android -- assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run UI tests on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            (cd apps/vpn-shop/android && bash gradlew connectedDebugAndroidTest --no-daemon) || { grep -rh -A3 "<failure" apps/vpn-shop/android/app/build/outputs/androidTest-results | head -40 | sed 's/^/::error title=android-user UI test::/'; exit 1; }
            (cd apps/lucy-admin/android && bash gradlew connectedDebugAndroidTest --no-daemon) || { grep -rh -A3 "<failure" apps/lucy-admin/android/app/build/outputs/androidTest-results | head -40 | sed 's/^/::error title=android-admin UI test::/'; exit 1; }

  ios-ui:
    name: iOS • UI tests
    # Hosted arm64 jobs were cancelled before acquisition during the capacity incident.
    # Standard Intel macOS 26 supplies the same XCUITest scenario; arm64 build jobs remain separate.
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Runner and Xcode identity
        run: |
          uname -m
          sw_vers
          xcodebuild -version
      - name: XCUITest on a simulator
        working-directory: apps/vpn-shop/ios
        env:
          CHECKED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          device=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          result_bundle="$RUNNER_TEMP/xcuitest-first.xcresult"
          run_tests() { xcodebuild test -project VpnShopUser.xcodeproj -scheme VpnShopUser -destination "id=$device" -configuration Debug -resultBundlePath "$result_bundle" CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/xcuitest.log" "$result_bundle.log" | tail -n 80; }
          if ! run_tests; then
            # A busy macOS runner sometimes cannot launch the app at all («does not have a process ID», «Failed to launch»).
            # Only that infrastructure failure gets one more try on a freshly erased simulator; a failed assertion does not.
            if grep -qE "does not have a process ID|Failed to launch|Failed to get background assertion" "$RUNNER_TEMP/xcuitest.log" \
               && ! grep -qE "XCTAssert" "$RUNNER_TEMP/xcuitest.log"; then
              echo "::warning title=XCUITest::the simulator could not launch the app; retrying once"
              xcrun simctl shutdown "$device" || true; xcrun simctl erase "$device"; xcrun simctl boot "$device"; xcrun simctl bootstatus "$device" -b
              result_bundle="$RUNNER_TEMP/xcuitest-retry.xcresult"
              run_tests || { grep -E "error:|failed|XCTAssert" "$RUNNER_TEMP/xcuitest.log" | head -30 | sed 's/^/::error title=XCUITest::/'; exit 1; }
            else
              grep -E "error:|failed|XCTAssert" "$RUNNER_TEMP/xcuitest.log" | head -30 | sed 's/^/::error title=XCUITest::/'; exit 1
            fi
          fi

          xcrun xcresulttool get test-results summary --path "$result_bundle" > "$RUNNER_TEMP/xcuitest-summary.json"
          python3 "$GITHUB_WORKSPACE/scripts/ci/verify_xcuitest_results.py" "$RUNNER_TEMP/xcuitest-summary.json" \
            --expected-tests 4 --output "$RUNNER_TEMP/xcuitest-verified.json"
      - name: Retain XCUITest summary and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: xcuitest-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/xcuitest-summary.json
            ${{ runner.temp }}/xcuitest-verified.json
            ${{ runner.temp }}/xcuitest.log
            ${{ runner.temp }}/xcuitest-*.xcresult.log
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS • ${{ matrix.app }} PKCE build
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - app: ios-user
            project: VpnShopUser
            dir: apps/vpn-shop/ios
          - app: ios-admin
            project: VpnShopAdmin
            dir: apps/lucy-admin/ios
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Compile simulator application
        working-directory: ${{ matrix.dir }}
        run: xcodebuild -project ${{ matrix.project }}.xcodeproj -scheme ${{ matrix.project }} -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build

  ios-extensions:
    # The customer app with both app extensions embedded (scripts/ios/enable-extensions.py) and the
    # tunnel engine linked: LibXray and HevSocks5Tunnel built from pinned commits and cached by them.
    # The Intel macOS 26 image is also used by the proven XCUITest job: its CoreSimulator can spawn
    # a process after a clean boot, unlike the macos-latest image observed on the runtime probe.
    name: iOS • tunnel and rich push extensions
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - id: apple-tools
        name: Identify Xcode and Go for the framework cache
        run: |
          xcode_id="$(xcodebuild -version | awk '/Build version/{print $3}')"
          test -n "$xcode_id"
          echo "id=$xcode_id-$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - id: frameworks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/vpn-shop/ios/Frameworks
          key: ios-tunnel-${{ runner.arch }}-${{ steps.apple-tools.outputs.id }}-${{ hashFiles('scripts/ios/build-tunnel-frameworks.sh', 'scripts/ios/verify_tunnel_frameworks.py') }}
      - name: Build LibXray and HevSocks5Tunnel
        if: steps.frameworks.outputs.cache-hit != 'true'
        run: bash scripts/ios/build-tunnel-frameworks.sh
      - name: Verify both iOS destinations and the native ABI
        run: bash scripts/ios/build-tunnel-frameworks.sh --verify
      - name: Embed the extensions
        run: |
          ls apps/vpn-shop/ios/Frameworks 2>/dev/null | sed 's/^/::notice title=frameworks::/' || echo "::warning title=frameworks::none built"
          python3 scripts/ios/enable-extensions.py --tunnel --push | sed 's/^/::notice title=enable::/'
          grep -c "xcframework in Frameworks" apps/vpn-shop/ios/VpnShopUser.xcodeproj/project.pbxproj | sed 's/^/::notice title=linked frameworks::/' 
      - name: Compile app + CorgiTunnel + CorgiNotificationService
        working-directory: apps/vpn-shop/ios
        run: |
          set -o pipefail
          xcodebuild -project VpnShopUser.xcodeproj -scheme VpnShopUser -sdk iphonesimulator -configuration Debug \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/ext.log" | tail -n 40 \
            || { grep -E "error:" "$RUNNER_TEMP/ext.log" | head -20 | sed 's/^/::error title=extensions::/'; exit 1; }
          app=$(find build/Build/Products -name VpnShopUser.app -maxdepth 3 | head -1)
          for ext in CorgiTunnel CorgiNotificationService; do
            [ -d "$app/PlugIns/$ext.appex" ] || { echo "::error title=extensions::$ext.appex is not embedded"; exit 1; }
          done
          /usr/libexec/PlistBuddy -c 'Print :CorgiTunnelEnabled' "$app/Info.plist" | grep -qx YES
          binary="$app/PlugIns/CorgiTunnel.appex/CorgiTunnel"
          grep -E "warning: .*(LibXray|HevSocks5Tunnel|canImport)|error:" "$RUNNER_TEMP/ext.log" | head -10 | sed 's/^/::notice title=build::/' || true
          # Files, not `nm | grep -q`: under pipefail an early-exiting grep fails the pipeline.
          nm "$binary" > "$RUNNER_TEMP/symbols.txt" 2>/dev/null || true
          strings "$binary" > "$RUNNER_TEMP/strings.txt" || true
          grep -ciE "hev_socks5|LibXray" "$RUNNER_TEMP/symbols.txt" | sed 's/^/::notice title=engine symbols::/' || true
          if grep -q "Встроенный VPN не собран" "$RUNNER_TEMP/strings.txt"; then
            echo "::error title=extensions::CorgiTunnel was compiled without LibXray/HevSocks5Tunnel"; exit 1
          fi
          for symbol in LibXrayInvoke hev_socks5_tunnel_main_from_str hev_socks5_tunnel_quit; do
            grep -Eq "[[:space:]]_${symbol}$" "$RUNNER_TEMP/symbols.txt" || { echo "Missing linked symbol: $symbol"; exit 1; }
          done
      - name: Exercise the Swift VPN engine on an iOS simulator
        timeout-minutes: 10
        run: python3 tests/ios/tunnel_runtime.py
      - name: Save the iOS source revisions and binary hashes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-tunnel-provenance
          path: |
            apps/vpn-shop/ios/Frameworks/SOURCES.txt
            apps/vpn-shop/ios/Frameworks/ios-sha256.txt
          if-no-files-found: error

  gate:
    # The one required status check for main (Settings → Rules): green only when every job above passed.
    # A new job must be added to `needs` — otherwise the gate does not wait for it.
    name: CI gate
    if: always()
    needs: [python315-native-arm64, python315-wheels, backend, lint, passkey-browser, support, security, frontend, compose, containers, android, android-engine, android-ui, ios-ui, ios, ios-extensions]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')
          if [ -n "$failed" ]; then echo "::error title=CI gate::not green: $failed"; exit 1; fi
