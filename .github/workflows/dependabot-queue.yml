name: Dependabot queue

# Keep one open pull request. Extra Dependabot updates are closed only after their
# identity is stored, and the next one is reopened when the active request is gone.
# The decision script is the copy on main, never the code from the dependency PR.
on:
  pull_request_target:
    types: [opened, reopened, closed, synchronize]
  push:
    branches: [main]
  schedule:
    - cron: "17 8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: write

concurrency:
  group: dependabot-queue
  cancel-in-progress: false

jobs:
  intake:
    name: One dependency update at a time
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the queue script from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          sparse-checkout: |
            scripts/dependabot-queue.cjs
            docs/dependabot-queue.json
          sparse-checkout-cone-mode: false
      - name: Record the queue, then open or close one update
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const {plan, isDependabot, inspectOpenPulls, inspectCiRuns, dispatchRetry, reopenQueuedPull, REOPEN_COOLDOWN_MS} = require(`${process.env.GITHUB_WORKSPACE}/scripts/dependabot-queue.cjs`);
            const {owner, repo} = context.repo;
            const branch = 'automation/dependabot-queue';
            const path = 'docs/dependabot-queue.json';
            async function load() {
              let ref;
              try {
                ref = await github.rest.git.getRef({owner, repo, ref: `heads/${branch}`});
              } catch (error) {
                if (error.status !== 404) throw error;
                const file = await github.rest.repos.getContent({owner, repo, path, ref: 'main'});
                return {state: JSON.parse(Buffer.from(file.data.content, 'base64').toString('utf8')), parent: null};
              }
              const commit = await github.rest.git.getCommit({owner, repo, commit_sha: ref.data.object.sha});
              const tree = await github.rest.git.getTree({owner, repo, tree_sha: commit.data.tree.sha, recursive: 'true'});
              const entry = tree.data.tree.find((item) => item.path === path);
              const blob = await github.rest.git.getBlob({owner, repo, file_sha: entry.sha});
              return {state: JSON.parse(Buffer.from(blob.data.content, 'base64').toString('utf8')), parent: ref.data.object.sha};
            }
            async function store(state, parent) {
              const content = `${JSON.stringify(state, null, 2)}\n`;
              const blob = await github.rest.git.createBlob({owner, repo, content, encoding: 'utf-8'});
              const tree = await github.rest.git.createTree({owner, repo, tree: [{path, mode: '100644', type: 'blob', sha: blob.data.sha}]});
              const commit = await github.rest.git.createCommit({
                owner, repo, message: 'Record the Dependabot queue\n\nClaude-Session: not-applicable (Grok; Claude session not used)\n',
                tree: tree.data.sha, parents: parent ? [parent] : [],
              });
              if (parent) {
                await github.rest.git.updateRef({owner, repo, ref: `heads/${branch}`, sha: commit.data.sha});
              } else {
                await github.rest.git.createRef({owner, repo, ref: `refs/heads/${branch}`, sha: commit.data.sha});
              }
              return commit.data.sha;
            }
            const loaded = await load();
            const pulls = await inspectOpenPulls(github, {owner, repo});
            const checksByNumber = {};
            let ciRuns = [];
            const [candidate] = pulls;
            if (pulls.length === 1 && isDependabot(candidate) && candidate.mergeable) {
              checksByNumber[candidate.number] = await github.paginate(github.rest.checks.listForRef, {owner, repo, ref: candidate.head.sha, per_page: 100});
              ciRuns = await inspectCiRuns(github, {owner, repo}, candidate);
            }
            const mergedNumbers = [];
            const openNumbers = new Set(pulls.map(pull => pull.number));
            const recordedNumbers = new Set([
              ...(loaded.state.active ? [loaded.state.active.number] : []),
              ...(loaded.state.deferred || []).map(item => item.number),
            ]);
            for (const number of recordedNumbers) {
              if (openNumbers.has(number)) continue;
              const recorded = await github.rest.pulls.get({owner, repo, pull_number: number});
              if (recorded.data.state !== 'closed') throw new Error(`PR #${number} changed during queue inspection`);
              if (recorded.data.merged) mergedNumbers.push(number);
            }
            const result = plan({openPulls: pulls, state: loaded.state, checksByNumber, ciRuns, now: new Date().toISOString(), mergedNumbers});
            const saved = await store(result.state, loaded.parent);
            core.info(`Queue stored at ${saved}. Actions: ${result.actions.map((item) => item.type + ' #' + item.number).join(', ') || 'none'}`);
            for (const action of result.actions) {
              if (action.comment && action.type !== 'reopen') {
                await github.rest.issues.createComment({owner, repo, issue_number: action.number, body: `${action.comment}\n\nQueue commit: ${saved}`});
              }
              if (action.type === 'close') {
                await github.rest.pulls.update({owner, repo, pull_number: action.number, state: 'closed'});
              } else if (action.type === 'reopen') {
                const item = result.state.active;
                const outcome = await reopenQueuedPull(github, {owner, repo}, item);
                if (outcome === 'refused') {
                  const reopenAfter = new Date(Date.parse(result.state.updatedAt) + REOPEN_COOLDOWN_MS).toISOString();
                  result.state.active = null;
                  result.state.deferred.push({...item, status: 'waiting', reopenAfter, note: 'GitHub refused to reopen (HTTP 422)'});
                  result.state.history.push({at: result.state.updatedAt, action: 'reopen-refused', number: item.number, reopenAfter});
                  await store(result.state, saved);
                  core.warning(`PR #${item.number} stays in the queue and becomes eligible at ${reopenAfter}`);
                } else if (outcome === 'open') {
                  await github.rest.issues.createComment({owner, repo, issue_number: item.number, body: `${action.comment}\n\nQueue commit: ${saved}`});
                }
              } else if (action.type === 'rerun') {
                const {retry} = result.state.active;
                if (await dispatchRetry(github, {owner, repo}, candidate, retry)) {
                  retry.phase = 'accepted';
                  await store(result.state, saved);
                }
              }
            }
