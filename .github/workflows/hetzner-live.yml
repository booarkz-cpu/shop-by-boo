name: Hetzner live

# Node autoscaling against the real Hetzner Cloud API: creates the smallest server with the shop's cloud-init and
# deletes it (one hour of the smallest server is billed). Run by hand after adding the HETZNER_API_TOKEN secret.
on:
  workflow_dispatch:
    inputs:
      server_type:
        description: "Server type"
        default: "cx22"
      location:
        description: "Location (hel1, fsn1, nbg1, ash, hil, sin)"
        default: "hel1"

permissions:
  contents: read

jobs:
  hetzner:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_SECRET: ci-only-secret
      APP_ENV: test
      DATABASE_URL: sqlite+aiosqlite:///./live.db
      HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
      HETZNER_SERVER_TYPE: ${{ inputs.server_type }}
      HETZNER_LOCATION: ${{ inputs.location }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Token is set
        run: test -n "$HETZNER_API_TOKEN" || { echo "::error title=Hetzner live::Add the HETZNER_API_TOKEN secret (Settings → Secrets and variables → Actions)"; exit 1; }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt -r backend/requirements-test.txt
      - run: python -m pytest -q -rfE tests/live/test_hetzner_live.py -p no:cacheprovider
