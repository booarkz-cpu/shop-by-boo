name: zz admin shots (scratch)
'on':
  push:
    branches:
    - scratch/**
permissions:
  contents: read
jobs:
  quick:
    name: Admin panel and cabinet catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: shots
          POSTGRES_PASSWORD: shots-password
          POSTGRES_DB: shots
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U shots -d shots" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8.10-alpine
        ports:
        - 6379:6379
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.14'
        cache: pip
        cache-dependency-path: 'backend/requirements.txt

          backend/requirements-test.txt

          '
    - uses: actions/setup-node@v7
      with:
        node-version: '26'
        cache: npm
        cache-dependency-path: 'admin/package-lock.json

          cabinet/package-lock.json

          '
    - name: Install and build
      run: 'python -m pip install -r backend/requirements.txt -r backend/requirements-test.txt

        cd admin

        npm ci

        npm ci --prefix ../cabinet

        npx playwright install --with-deps chromium

        npm run build

        NEXT_BASE_PATH=/cabinet npm run build --prefix ../cabinet

        '
    - name: Capture every admin and cabinet section
      env:
        APP_ENV: test
        APP_SECRET: browser-test-only-secret-at-least-32-characters
        COOKIE_SECURE: 'false'
        COOKIE_SAMESITE: lax
        MOBILE_REQUIRE_PROOF: 'false'
        PAYMENTS_SANDBOX: 'true'
        CUSTOMER_WEBAUTHN_ORIGIN: http://localhost:8777
        WEBAUTHN_ORIGIN: http://localhost:8777
        BROWSER_DATABASE_URL: postgresql+asyncpg://shots:shots-password@127.0.0.1:5432/shots
        BROWSER_REDIS_URL: redis://127.0.0.1:6379/0
      run: 'python tests/passkey_browser_server.py > "$RUNNER_TEMP/server.log" 2>&1 &

        for i in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:8777/ && break; sleep 2; done

        node admin/scripts/screenshots-catalog.mjs "$PWD"

        cp "$(python3 -c ''import tempfile; print(tempfile.gettempdir())'')/admin-screenshots-index.json" screenshots/admin-screenshots-index.json

        '
    - uses: actions/upload-artifact@v7
      with:
        name: admin-screenshots
        path: 'screenshots/admin_panel/

          screenshots/storefront_user/

          screenshots/admin-screenshots-index.json

          '
        if-no-files-found: error
