name: zz quick tests (scratch, never merged)
on:
  push:
    branches: ['scratch/**']
jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18.6-alpine
        env: {POSTGRES_USER: vpnshop, POSTGRES_PASSWORD: ci-password, POSTGRES_DB: vpnshop}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U vpnshop -d vpnshop" --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
    env:
      APP_SECRET: ci-only-secret
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://vpnshop:ci-password@127.0.0.1:5432/vpnshop
      DB_USER: vpnshop
      DB_PASSWORD: ci-password
      DB_NAME: vpnshop
      REDIS_URL: redis://127.0.0.1:6379/0
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-admin-password
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      PAYMENTS_SANDBOX: "true"
      MOBILE_REQUIRE_PROOF: "false"
      AUTO_RENEW_ENABLED: "false"
      AUDIT_TEST_DATABASE_URL: postgresql+asyncpg://vpnshop:ci-password@127.0.0.1:5432/vpnshop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r backend/requirements.txt -r backend/requirements-test.txt
      - run: cd backend && alembic upgrade head
      - name: tests
        run: |
          set +e
          if grep -q '^cmd:' .quick-tests; then
            sed 's/^cmd://' .quick-tests > /tmp/cmd.sh; bash /tmp/cmd.sh > /tmp/log 2>&1; echo "status=$?" > /tmp/status
            grep -E "^(FAILED|ERROR|[^ ]+:[0-9]+:[0-9]+: )" /tmp/log | head -60 | sed 's/^\([^F]\)/FAILED \1/' > /tmp/fails0 || true
            tail -3 /tmp/log | sed 's/^/FAILED tail: /' >> /tmp/fails0; cp /tmp/fails0 /tmp/log2
          else
          python -m pytest -q -rfE $(cat .quick-tests) --disable-warnings --timeout=300 -p no:cacheprovider > /tmp/log 2>&1
          echo "status=$?" > /tmp/status
          fi
          tail -5 /tmp/log
          if [ -f /tmp/log2 ]; then cut -c1-900 /tmp/log2 > /tmp/fails; else grep -E "^(FAILED|ERROR) " /tmp/log | sed 's/ - /: /' | cut -c1-900 > /tmp/fails; fi
          python3 - <<'PY'
          import re
          lines=open('/tmp/fails').read().splitlines()
          summary=[l for l in open('/tmp/log').read().splitlines() if re.search(r'\d+ (passed|failed|errors?|fixable)', l)][-1:]
          kinds=['error','warning','notice']
          print(f"::notice title=summary::{summary[0] if summary else 'no summary'} ({len(lines)} failing)")
          for i,l in enumerate(lines[:29]):
              print(f"::{kinds[i//10 % 3] if i<29 else 'notice'} title=F{i}::{l}")
          PY
      - name: more
        run: |
          python3 - <<'PY'
          lines=open('/tmp/fails').read().splitlines()[29:]
          kinds=['error','warning','notice']
          for i,l in enumerate(lines[:30]):
              print(f"::{kinds[i//10]} title=G{i}::{l}")
          PY
          . /tmp/status; exit $status
