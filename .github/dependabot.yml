# Weekly dependency updates. Every update is a pull request that must pass the full CI
# (backend, Support Pro, admin/cabinet builds, e2e, dependency audit) before merging.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    groups:
      backend-minor: {update-types: [minor, patch]}
  - package-ecosystem: pip
    # support-pro/requirements.txt is the only Support Pro lock: tests and the image install it.
    directory: /support-pro
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    groups:
      support-minor: {update-types: [minor, patch]}
    ignore:
      # aiogram 3.31 requires pydantic<2.14; lift when aiogram allows newer pydantic.
      - dependency-name: pydantic
        versions: [">=2.14"]
      - dependency-name: pydantic-core
        versions: [">=2.47"]
  - package-ecosystem: npm
    directory: /apps/lucy-admin/web
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    groups:
      admin-minor: {update-types: [minor, patch]}
    ignore:
      # Types must match the runtime: images and CI use Node 26.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /apps/user-cabinet
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    groups:
      cabinet-minor: {update-types: [minor, patch]}
    ignore:
      # Types must match the runtime: images and CI use Node 26.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /apps/telegram-mini-app
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    groups:
      miniapp-minor: {update-types: [minor, patch]}
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  # v28.90.0 (stage 20, N3): the three Android apps (Gradle plugins, Kotlin, Compose, libraries).
  - package-ecosystem: gradle
    directory: /apps/vpn-shop/android
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    groups:
      android-user-minor: {update-types: [minor, patch]}
  - package-ecosystem: gradle
    directory: /apps/lucy-admin/android
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    groups:
      android-admin-minor: {update-types: [minor, patch]}
  - package-ecosystem: gradle
    directory: /apps/vpn-client/android
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    groups:
      android-client-minor: {update-types: [minor, patch]}
  # Base images of every Dockerfile (pinned by digest: Dependabot moves tag and digest together).
  - package-ecosystem: docker
    directories: [/backend, /admin, /cabinet, /miniapp, /deploy/caddy, /support-pro/app]
    schedule: {interval: weekly, day: monday}
    groups:
      docker-images: {update-types: [minor, patch]}
  # Images of the compose files (PostgreSQL, Redis, Caddy, …).
  - package-ecosystem: docker-compose
    directories: [/, /support-pro]
    schedule: {interval: weekly, day: monday}
    groups:
      compose-images: {update-types: [minor, patch]}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly, day: monday}
