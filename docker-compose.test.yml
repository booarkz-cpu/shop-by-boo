# Local shop without payment gateways, Telegram, Remnawave or Support Pro.
# Start: bash scripts/test-up.sh
# Ports 18080-18083 bind to loopback only. This stack is a local shop check.

services:
  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - test_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  db:
    image: postgres:18.6-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    environment:
      POSTGRES_USER: vpnshop
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.test}
      POSTGRES_DB: vpnshop
    volumes:
      - test_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpnshop -d vpnshop"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env.test
    environment:
      WORKER_ROLE: api
      MEDIA_DIR: /data/media
      BACKUPS_DIR: /data/backups
      PROJECT_DIR: /project
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8000"
    volumes:
      - test_media_data:/data/media
      - .:/project:ro
      - test_backup_data:/data/backups
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\", timeout=3)'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "worker.py"]
    env_file: .env.test
    environment:
      WORKER_ROLE: worker
      MEDIA_DIR: /data/media
      BACKUPS_DIR: /data/backups
      PROJECT_DIR: /project
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - test_media_data:/data/media
      - .:/project:ro
      - test_backup_data:/data/backups

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
      args:
        VITE_API_URL: ""
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:18081:80"
    volumes:
      - ./deploy/nginx/test-proxy.conf:/etc/nginx/conf.d/default.conf:ro

  cabinet:
    build:
      context: ./cabinet
      args:
        VITE_API_URL: ""
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:18082:80"
    volumes:
      - ./deploy/nginx/test-proxy.conf:/etc/nginx/conf.d/default.conf:ro

  miniapp:
    build:
      context: .
      dockerfile: miniapp/Dockerfile
      args:
        VITE_API_URL: ""
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:18083:80"
    volumes:
      - ./deploy/nginx/test-proxy.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  test_redis_data:
  test_postgres_data:
  test_media_data:
  test_backup_data:
