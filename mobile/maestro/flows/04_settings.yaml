appId: shop.remnawave.user.preview
name: Settings, documents and sign-out
---
- launchApp:
    clearState: true
    arguments:
      corgi_demo: true
      corgi_tab: settings
      corgi_lang: ru
# A cold start of a cleared debug build on a CI emulator can take longer than the default wait.
- extendedWaitUntil:
    visible: "Документы"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Выйти"
    direction: DOWN
- takeScreenshot: android-05-settings
