appId: shop.remnawave.user.preview
name: Giveaways and the home promo
---
- launchApp:
    clearState: true
    arguments:
      corgi_demo: true
      corgi_tab: giveaways
      corgi_lang: ru
# A cold start of a cleared debug build on a CI emulator can take longer than the default wait.
- extendedWaitUntil:
    visible: "Новогоднее колесо"
    timeout: 30000
- assertVisible: "Участвовать"
- takeScreenshot: android-04-giveaways
