rule_files: [vpnshop-alerts.yml]
evaluation_interval: 30s
tests:
  - interval: 30s
    input_series:
      - series: 'up{job="vpnshop"}'
        values: '0x8'
    alert_rule_test:
      - eval_time: 3m
        alertname: VpnShopUnavailable
        exp_alerts:
          - exp_labels: {job: vpnshop, severity: critical}
            exp_annotations: {summary: 'VPN Shop API metrics unavailable'}
  - interval: 30s
    input_series:
      - series: 'vpnshop_database_metrics_available{job="vpnshop"}'
        values: '0x8'
    alert_rule_test:
      - eval_time: 3m
        alertname: VpnShopDatabaseMetricsUnavailable
        exp_alerts:
          - exp_labels: {job: vpnshop, severity: critical}
            exp_annotations: {summary: 'VPN Shop database metrics query failed or timed out'}
  - interval: 30s
    input_series:
      - series: 'vpnshop_workers_online{job="vpnshop"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 2m
        alertname: VpnShopNoWorker
        exp_alerts: []
      - eval_time: 4m
        alertname: VpnShopNoWorker
        exp_alerts:
          - exp_labels: {job: vpnshop, severity: critical}
            exp_annotations: {summary: 'No worker heartbeat within ninety seconds'}
  - interval: 30s
    input_series:
      - series: 'vpnshop_oldest_queued_job_seconds{job="vpnshop"}'
        values: '1000x14'
    alert_rule_test:
      - eval_time: 6m
        alertname: VpnShopQueueStalled
        exp_alerts:
          - exp_labels: {job: vpnshop, severity: warning}
            exp_annotations: {summary: 'Oldest queued job has waited over fifteen minutes (including retry backoff)'}
  - interval: 30s
    input_series:
      - series: 'vpnshop_requests_total{job="vpnshop"}'
        values: '0+60x22'
      - series: 'vpnshop_errors_total{job="vpnshop"}'
        values: '0+6x22'
    alert_rule_test:
      - eval_time: 10m
        alertname: VpnShopApiErrors
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {summary: 'API server error ratio exceeds five percent'}
  - interval: 30s
    input_series:
      - series: 'vpnshop_admin_login_failures_15m{job="vpnshop"}'
        values: '12x8'
    alert_rule_test:
      - eval_time: 2m
        alertname: VpnShopAdminBruteForce
        exp_alerts:
          - exp_labels: {job: vpnshop, severity: critical}
            exp_annotations: {summary: 'Ten or more failed admin sign-ins within fifteen minutes'}
  - interval: 30s
    input_series:
      - series: 'vpnshop_nodes_down{job="vpnshop"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: VpnShopNodesDown
        exp_alerts:
          - exp_labels: {job: vpnshop, severity: critical}
            exp_annotations: {summary: 'Remnawave nodes are down'}
  - interval: 1m
    input_series:
      - series: 'vpnshop_backup_last_success_age_seconds{job="vpnshop"}'
        values: '-1x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: VpnShopBackupStale
        exp_alerts:
          - exp_labels: {job: vpnshop, severity: warning}
            exp_annotations: {summary: 'No completed backup within thirty-six hours'}
